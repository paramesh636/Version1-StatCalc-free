<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistics Calculator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="src/scripts/keywords.js"></script>
</head>
<style>

    :root {
        --background: white;
        --text: black;
        --shadow: 0 2px 10px grey;
        --grey: grey;
        --focus: rgb(230,230,230);
        --themegradient: white;
    }
body{
padding: 0;
margin: 0;
display: flex;
justify-content: center;
align-items: center;
height: 96.8vh;
background-color: var(--background);
color: var(--text);
transition: background-color 0.5s ease, color 0.5s ease;
}
.sidebar{
height: 100%;
width: 400px;
padding: 20px;
display: flex;
flex-direction: column;
align-items: center;
box-shadow: var(--shadow);
overflow-y: auto;
overflow-x: hidden;
transition: all 0.3s ease;
scroll-behavior: smooth;
position: relative;
}
.sidebar.active{
width: 50px;
}

.content{
width: 100%;
height: 100%;
}

object{
width: 100%;
height: 100%;
}

.top-header {
    width: 90%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    margin-top: 25px;
}

#menu-btn, #minimize {
    height: 40px;
    width: 40px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    border: none;
    background: var(--background);
    color: var(--text);
    cursor: pointer;
    transition: background 0.3s;
}
#menu-btn:hover, #minimize:hover {
    background: var(--focus);
}

#title{
    font-family: monospace; 
    margin-right: auto;
}


.search{
height: 40px;
width: 90%;
border-radius: 10px;
display: flex;
justify-content: space-evenly;
align-items: center;
flex-shrink: 0;
background: var(--background);
color: var(--text);
border: 1px solid var(--grey);
}

.search:focus-within{
background: var(--focus);
}
.search input{
background: transparent;
color: var(--text);
border: none;
height: 100%;
width: 70%;
font-family: monospace;
font-size: 16px;
outline: none;
}
input::placeholder{
color: var(--text);
text-align: left;
}

.heading{
width: 90%;
text-align: left;
margin-top: 30px;
margin-bottom: 10px;
font-size: 16px;
font-family: monospace;
color: var(--grey);
}

.sidebar.active .search,
.sidebar.active .heading,
.sidebar.active button:not(#minimize),
.sidebar.active #menu-btn,
.sidebar.active #title {
    display: none;
}

.sidebar button{
width: 90%;
height: 50px;
font-weight: bold;
font-size: 16px;
border: none;
background: var(--background);
color: var(--text);
text-align: left;
border-radius: 10px;
padding: 15px;
}
.sidebar button:hover{
cursor: pointer;
background: var(--focus);
}
.line{
width: 90%;
border: 1px solid rgb(225,225,225);
margin-bottom: 10px
}
button{
font-family: monospace;
}

::-webkit-scrollbar {
    width: 4px;
}
::-webkit-scrollbar-track {
    background: transparent;
}
::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.2);
    border-radius: 999px;
}
button.highlight {
    background: #e0f0ff;
    border-left: 4px solid #3498db;
    color: #2c3e50;
    transition: all 0.3s ease;
}
button.highlight:hover {
    background: #c0e0ff;
}
.dropdown {
    position: absolute;
    top: 70px;
    left: 20px;
    background: var(--themegradient);
    border-radius: 10px;
    box-shadow: var(--shadow);
    width: 180px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition: all 0.3s ease;
    z-index: 100;
}
.dropdown.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}
.dropdown a {
    display: block;
    padding: 12px 16px;
    text-decoration: none;
    color: var(--text);
    font-family: monospace;
}
.dropdown a:hover {
    background: var(--focus);
}

body.dark {
    --background: #121212;
        --text: #f0f0f0;
        --shadow: 0 2px 10px black;
        --grey: grey;
        --focus: #2a2a2a;
        --themegradient: rgb(60,60,60);
}
</style>
<body>
<div class="sidebar">

    <div class="top-header">
        <h2 id="title" style="cursor:pointer" onclick="loadPage('src/pages/startup.html')">Statix</h2>
        <button id="menu-btn"><i class="fa-solid fa-ellipsis-vertical"></i></button>
        <button id="minimize"><i class="fa-solid fa-backward-step"></i></button>
    </div>

    <div class="dropdown" id="dropdown">
        <a style="cursor:pointer;" id="theme">Dark Theme</a>
        <a style="cursor:pointer;" id="history">History</a>
        <a href="https://your-purchase-link.com" target="_blank">Support</a>
    </div>

    <div class="search">
        <i class="fa fa-search"></i>
        <input id="search" type="text" name="search" placeholder=" Search">
    </div>
    <div class="heading">Descriptive Stats</div>
    <button onclick="loadPage('src/pages/correlation.html')">Correlation(Pearson)</button>
    <div class="line"></div>
    <button onclick="loadPage('src/pages/histogram.html')">Central Tendency</button>
    <div class="line"></div>
    <button onclick="loadPage('src/pages/sd.html')">Standard Deviation</button>
    <div class="line"></div>
    <button onclick="loadPage('src/pages/quartiles.html')">Quartiles and IQR</button>
    <div class="line"></div>
    <button onclick="loadPage('src/pages/zscore.html')">Z-Score</button>
    <div class="line"></div>
    <div class="heading">Regression</div>
    <button onclick="loadPage('src/pages/linear_curve_fit.html')">Linear Regression</button>
    <div class="line"></div>
    <button onclick="loadPage('src/pages/quadratic_curve_fit.html')">Quadratic Regression</button>
    <div class="line"></div>
    <button onclick="loadPage('src/pages/logregress.html')">Logistic Regression</button>
    <div class="line"></div>
    <button onclick="loadPage('src/pages/multiplelr.html')">Multiple Linear</button>
    <div class="line"></div>
    <div class="heading">Probability</div>
    <button onclick="loadPage('src/pages/normaldist.html')">Normal Dist.</button>
    <div class="line"></div>
    <button onclick="loadPage('src/pages/binomial.html')">Binomial Dist.</button>
    <div class="line"></div>
    <button onclick="loadPage('src/pages/poisson.html')">Poisson Dist.</button>
    <div class="line"></div>
    <button onclick="loadPage('src/pages/confidence.html')">Confidence Interval</button>
    <div class="line"></div>
    <button onclick="loadPage('src/pages/ttest.html')">T-Test(One-Sample)</button>
    <div class="line"></div>
    <button onclick="loadPage('src/pages/ttest2.html')">T-Test(Two-Sample)</button>
    <div class="line"></div>
    <button onclick="loadPage('src/pages/anova.html')">ANOVA(One-Way)</button>
    <div class="line"></div>
    <button onclick="loadPage('src/pages/chisquare.html')">Chi-Square Test</button>
    <div class="line"></div>
    <button onclick="loadPage('src/pages/manwhit.html')">Mann-Whitney U-Test</button>
    <div class="line"></div>
    <div class="heading">Misc</div>
    <button onclick="loadPage('src/pages/collatz.html')">Collatz Conj.</button>
    <div class="line"></div>
    <button onclick="loadPage('src/pages/visualize.html')">Logistic Map</button>
    <div class="line"></div>
    <button onclick="loadPage('src/pages/mandlebrot.html')">Mandelbrot Set</button>
    <div class="line"></div>
</div>
<div class="content">
    <object id="page" type="text/html" data="src/pages/startup.html"></object>
</div>

<script>
let page = document.getElementById('page');
let theme = document.getElementById('theme');
let darkMode = localStorage.getItem('theme') === 'dark';

let minimize = document.getElementById('minimize');
let sidebar = document.querySelector('.sidebar');
let search = document.querySelector('.search');
let headings = document.querySelectorAll('.heading');
let icon = minimize.querySelector('i');

minimize.addEventListener('click',()=>{
    sidebar.classList.toggle('active');
    search.classList.toggle('active');
    headings.forEach(heading => heading.classList.toggle('active'));
    
    if(sidebar.classList.contains('active')){
        icon.classList.remove("fa-backward-step");
        icon.classList.add("fa-forward-step");
    } else {
        icon.classList.remove("fa-forward-step");
        icon.classList.add("fa-backward-step");
    }
});

const menuBtn = document.getElementById('menu-btn');
const dropdown = document.getElementById('dropdown');
const historyBtn = document.getElementById('history');

menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    dropdown.classList.toggle('show');
});


document.addEventListener('click', () => {
    dropdown.classList.remove('show');
});

historyBtn.addEventListener('click',()=>{
    loadPage('src/pages/history.html');
});

localStorage.setItem(
    'theme',
    darkMode ? 'dark':'light'
    );


function applyTheme() {

    document.body.classList.toggle('dark', darkMode);
    const pageDocument = page.contentDocument;
    if(pageDocument){
        pageDocument.documentElement.classList.toggle('dark',darkMode);
    }

    
}


page.addEventListener('load', () => {
    applyTheme();
});

theme.addEventListener('click', () => {

    darkMode = !darkMode;
    localStorage.setItem(
        'theme',
        darkMode ? 'dark':'light'
        );

    applyTheme();

    theme.textContent = darkMode
        ? 'Light Theme'
        : 'Dark Theme';
});


function loadPage(filename){
    page.data = filename;
}

window.addEventListener('message',(event)=>{

    if(!event.data || event.data.type !== 'loadHistoryPage'){
        return;
    }

    if(!event.data.page){
        return;
    }

    loadPage(event.data.page);
})

const searchInput = document.getElementById('search');
const menuButtons = Array.from(document.querySelectorAll('.sidebar button')).filter(btn => !btn.id);

function scrollToButton(button) {
    if (!button) return;
    requestAnimationFrame(() => {
        const containerRect = sidebar.getBoundingClientRect();
        const buttonRect = button.getBoundingClientRect();
        const relativeTop = buttonRect.top - containerRect.top + sidebar.scrollTop;
        const targetScroll = relativeTop - (sidebar.clientHeight / 2) + (buttonRect.height / 2);
        sidebar.scrollTop = Math.max(0, targetScroll);
    });
}

function performSearch(){
    const query = searchInput.value.toLowerCase().trim();
    menuButtons.forEach(b => b.classList.remove('highlight'));
    if(!query) return;

    let bestMatch = null;
    let bestScore = 0;

    keywords.forEach(t => {
        let score = 0;
        t.keywords.forEach(k => {
            if(k.includes(query)) score++;
            if(query.includes(k)) score++;
        });
        if(score > bestScore){
            bestScore = score;
            bestMatch = t.topic;
        }
    });

    menuButtons.forEach(b => {
        if(b.textContent.toLowerCase() === bestMatch){
            bestMatch = b;
        }
    });

    if (bestMatch && bestScore > 0) {
        bestMatch.classList.add('highlight');
        scrollToButton(bestMatch);
    }
}

searchInput.addEventListener('input', performSearch);
searchInput.addEventListener('keydown',(e) => {
    if(e.key == 'Enter'){
        const highlighted = document.querySelector('.sidebar button.highlight');
        if(highlighted) highlighted.click();
        searchInput.value = '';
        highlighted.classList.remove('highlight');

    }
});
</script>
</body>
</html>
