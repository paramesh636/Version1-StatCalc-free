
<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Statistics Calculator</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	<script src="src/keywords.js"></script>

</head>

<style>
	body{
		padding: 0;
		margin: 0;
		display: flex;
		justify-content: center;
		align-items: center;
		height: 96.8vh;
		
	}

	.sidebar{
		height: 100%;
		width: 400px;
		padding: 20px;
		display: flex;
		flex-direction: column;
		align-items: center;
		box-shadow: 0 0 10px grey;
		overflow-y: auto;
		transition: all 0.3s ease;
		scroll-behavior: smooth;
		

	}

	.sidebar.active{
		width: 50px;
	}

	.sidebar.active button{
		display: none;
	}

	.content{
		width: 100%;
		height: 100%;
		padding: 20px;
	}

	.content.active{
		display: none;
	}

	object{
		width: 100%;
		height: 100%;
	}

	.search{
		height: 40px;
		width: 90%;
		border-radius: 10px;
		display: flex;
		justify-content: space-evenly;
		align-items: center;
		flex-shrink: 0;
		background: white;
		border: 1px solid grey;

	}
	.search.active{
		display: none;
	}

	.search:focus-within{
		background: rgb(230,230,230);
	}

	.search input{
		background: transparent;
		border: none;
		height: 100%;
		width: 70%;
		font-family: monospace;
		font-size: 16px;
		outline: none;
		justify-content: center;
		align-items: center;
	}

	input::placeholder{
		color: black;
		text-align: left;
	}


	#minimize{
		margin-left: auto;
		margin-right: 16px;
		margin-top: 20px;
		margin-bottom: 20px;
		height: 40px;
		width: 40px;
		border-radius: 50%;
		display: flex;
		justify-content: center;
		align-items: center;
	}

	.heading{
		width: 90%;
		text-align: left;
		margin-top: 30px;
		margin-bottom: 10px;
		font-size: 16px;
		font-family: monospace;
		color: grey;
	}

	.heading.active{
		display: none;
	}

	.sidebar button{
		width: 90%;
		height: 50px;
		font-weight: bold;
		font-size: 16px;
		border: none;
		background: transparent;
		text-align: left;
		border-radius: 10px;
		padding: 15px;

	}

	.sidebar button:hover{
		cursor: pointer;
		background: rgb(230,230,230);
	}

	.line{
		width: 90%;
		border: 1px solid rgb(225,225,225);
		margin-bottom: 10px
	}

	button{
		font-family: monospace;
	}

	::-webkit-scrollbar {
	    width: 4px;
	}

	::-webkit-scrollbar-track {
	    background: transparent;
	}

	::-webkit-scrollbar-thumb {
	    background: rgba(255,255,255,0.2);
	    border-radius: 999px;
	}

	button.highlight {
    background: #e0f0ff;
    border-left: 4px solid #3498db;
    color: #2c3e50;
    transition: all 0.3s ease;
	}

	button.highlight:hover {
	    background: #c0e0ff;
	}


</style>


<body>

	<div class="sidebar">
		<button id="minimize"><i class="fa-solid fa-backward-step"></i></button>
		<div class="search">
			<i class="fa fa-search"></i>

			<input id="search" type="text" name="search" placeholder="   Search">
		</div>
		<div class="heading">Descriptive Stats</div>
		<button onclick="loadPage('src/correlation.html')">Correlation(Pearson)</button>
		<div class="line"></div>
		<button onclick="loadPage('src/histogram.html')">Central Tendency</button>
		<div class="line"></div>
		<button onclick="loadPage('src/sd.html')">Standard Deviation</button>
		<div class="line"></div>
		<button onclick="loadPage('src/quartiles.html')">Quartiles and IQR</button>
		<div class="line"></div>
		<button onclick="loadPage('src/zscore.html')">Z-Score</button>
		<div class="line"></div>
		<div class="heading">Regression</div>
		<button onclick="loadPage('src/linear_curve_fit.html')">Linear Regression</button>
		<div class="line"></div>
		<button onclick="loadPage('src/quadratic_curve_fit.html')">Quadratic Regression</button>
		<div class="line"></div>
		<div class="heading">Probability</div>
		<button onclick="loadPage('src/normaldist.html')">Normal Distribution</button>
		<div class="line"></div>
		<button onclick="loadPage('src/binomial.html')">Binomial Distribution</button>
		<div class="line"></div>
		<div class="heading">Misc</div>
		<button onclick="loadPage('src/collatz.html')">Collatz Conj.</button>
		<div class="line"></div>
		<button onclick="loadPage('src/visualize.html')">Logistic Map</button>
		<div class="line"></div>
	</div>

	<div class="content">
		<object id="page" type="text/html" data="src/startup.html"></object>
	</div>
	<script>
		let page = document.getElementById('page');

		function loadPage(filename){
			page.data = filename;
		}

		let minimize = document.getElementById('minimize');
		let sidebar = document.querySelector('.sidebar');
		let search = document.querySelector('.search');
		let headings = document.querySelectorAll('.heading');
		let icon = minimize.querySelector('i');
		const searchInput = document.getElementById('search');
		const menuButtons = Array.from(document.querySelectorAll('.sidebar button')).filter(btn => !btn.id);

		minimize.addEventListener('click',()=>{
			sidebar.classList.toggle('active');
			search.classList.toggle('active');
			headings.forEach(heading => {
				heading.classList.toggle('active');
			});
			if(sidebar.classList.contains('active')){
				icon.classList.remove("fa-backward-step");
				icon.classList.add("fa-forward-step");
			}else{
				icon.classList.remove("fa-forward-step");
				icon.classList.add("fa-backward-step");
			}
		});

		function scrollToButton(button) {
		    if (!button) return;
		    
		    requestAnimationFrame(() => {
		        const containerRect = sidebar.getBoundingClientRect();
		        const buttonRect = button.getBoundingClientRect();
		        
		        const relativeTop = buttonRect.top - containerRect.top + sidebar.scrollTop;
		        const targetScroll = relativeTop - (sidebar.clientHeight / 2) + (buttonRect.height / 2);
		        
		        sidebar.scrollTop = Math.max(0, targetScroll);
		    });
		}

		function performSearch(){

			const query = searchInput.value.toLowerCase().trim();
			menuButtons.forEach(b => b.classList.remove('highlight'));

			if(!query){
				return;
			}

			let bestMatch = null;
			let bestScore = 0;

			keywords.forEach(t => {

				
				let score = 0;

				t.keywords.forEach(k => {

					if(k.includes(query)){
						score++;
					}
					if(query.includes(k)){
						score++;
					}
				});

				if(score > bestScore){
					bestScore = score;
					bestMatch = t.topic;
				}

			});

			menuButtons.forEach(b => {

				if(b.textContent.toLowerCase() == bestMatch){
					bestMatch = b;
				}
			});




	        if (bestMatch && bestScore > 0) {

	            bestMatch.classList.add('highlight');
	            scrollToButton(bestMatch);
	        }


		}

		searchInput.addEventListener('input',performSearch);
		searchInput.addEventListener('keydown',(e) => {

			if(e.key == 'Enter'){
				const highlighted = document.querySelector('.sidebar button.highlight');
				if(highlighted){
					highlighted.click();
				}
			}
		});
		document.addEventListener('click',()=>{

			menuButtons.forEach(b => b.classList.remove('highlight'));
		});

	</script>
</body>
</html>
