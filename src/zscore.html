<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Statistics Calculator</title>
	<script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  	<script id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  	</script>
	<script src="statscalc.js"></script>
	<link rel="stylesheet" type="text/css" href="styles.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

	<div class="container">
		
		<div class="head">
			<h1>Z - Score</h1>
			<i class="fa-regular fa-circle-question" id="info"></i>
			<div id="infoBox"></div>
		</div>
		<h2>The Deviation of a target value from the data's mean.</h2>
		<div class="row">
			<label>Target:</label>
			<input type="text" name="x" id="x" placeholder="Enter Target Value" required>
		</div>
		<div class="row">
			<label>Data:</label>
			<input type="text" name="y" id="y" placeholder="Enter Data" required>
		</div>
		<button id="calculate">Generate</button>
	</div>

	<p id="answer"></p>


	<div class="graph">
		<canvas id="myChart"></canvas>
	</div>

	<button id="steps">Show Steps</button>
	<p id="ansSteps"></p>

	<script>
		
		let x = document.getElementById("x");
		let y = document.getElementById("y");
		let submit = document.getElementById("calculate");
		let result = document.getElementById("answer");
		let steps = document.getElementById("steps");
		let ansSteps = document.getElementById("ansSteps");
		let my_chart = null;
		let steps_html;
		const info = document.getElementById("info");
		const infoBox = document.getElementById('infoBox');
		let hoverTimer;
		const desc =  `
			        <h3>Z-Score</h3>

					<h4>
					    Measures how far a value lies from the mean of a dataset in terms of standard deviations.
					</h4>

					<ul>
					    <li>
					        <b>Positive Z-Score</b> → Indicates that the value is above the mean. Larger positive values represent observations further above the average.
					    </li>

					    <li>
					        <b>Negative Z-Score</b> → Indicates that the value is below the mean. Smaller negative values represent observations further below the average.
					    </li>

					    <li>
					        <b>Z = 0</b> → Indicates that the value is exactly equal to the mean of the dataset.
					    </li>

					    <li>
					        <b>|Z| < 2</b> → Suggests that the value is relatively close to the mean and is generally considered typical.
					    </li>

					    <li>
					        <b>|Z| > 2</b> → Suggests that the value is unusually far from the mean and may be considered atypical.
					    </li>

					    <li>
					        <b>This is useful for comparing values from different datasets, identifying unusual observations, and determining relative position within a distribution.
					    </li>
					</ul>
			    `;

		function showInfo(){
			infoBox.innerHTML = desc;
			infoBox.classList.add("show");
		}
		function hideInfo(){
			infoBox.innerHTML = "";
			infoBox.classList.remove("show");

		}

		info.addEventListener("mouseenter",()=>{

			hoverTimer = setTimeout(()=>{
				showInfo();
			},1000);
		});

		info.addEventListener("mouseleave",()=>{

			clearTimeout(hoverTimer);
		});

		info.addEventListener("click",(e)=>{

			e.stopPropagation();

			if(infoBox.classList.contains("show")){
				hideInfo();
			}else{
				showInfo();
			}
		});

		infoBox.addEventListener("mouseenter", () => {
		    clearTimeout(hoverTimer);
		});

		infoBox.addEventListener("mouseleave", () => {
		    hideInfo();
		});

		document.addEventListener("click", () => {
		    hideInfo();
		});

		submit.addEventListener("click",()=>{

			ansSteps.innerHTML = ' ';

			if(my_chart){
				my_chart.destroy();
			}

		let target_x;
		let data_y;
		try{

			if(y.value.trim() === ""){
			    throw "Please enter some data.";
			}

			if(x.value.trim() === ""){
				throw "Please enter target value.";
			}

		    data_y = y.value.trim().split(/[\s,]+/).map(Number);
		    let x_value = x.value.trim().split(/[\s,]+/).map(Number);
		    if(x_value.length > 1){
		    	throw "Only one target value allowed."
		    }
		    target_x = x_value[0];


		    if(Number.isNaN(Number(x.value)) || data_y.some(Number.isNaN)){
		        throw "Only numerical values are allowed.";
		    }

		}catch(error){

		    alert(error);
		    return;

		}

		let values = z_score(data_y,target_x);
		let mean_y = values[1];
		let sd = values[2];
		let z = values[0];

		result.innerHTML = `
			<div style = "height: 6em;display: grid; text-align: center;grid-template-columns: auto auto auto; gap: 0 1em;
			 font-size: 2em; font-family: monospace;">
				<span>Z-Score</span><span>:</span><span>${z}</span>
				<span>Mean</span><span>:</span><span>${mean_y}</span>
				<span>Standard Deviation</span><span>:</span><span>${sd}</span>
				
				
			</div>
		`;

		steps.style.display = "block";

		
		let dist = normal_distribution(mean_y,sd);
		let maxY = Math.max(...dist.curve);
		let shadedRegion = dist.labels.map((x, i) => {

			if(x <= target_x){
				return {
					x: x,
					y: dist.curve[i]
				};
			}

			return {
				x: x,
				y: null
			};

		});

		my_chart = new Chart("myChart", {

			type: 'line',

			data: {

				datasets: [
					{
						label: 'Mean',

						data: [
							{x: mean_y, y: 0},
							{x: mean_y, y: maxY}
						],

						borderWidth: 3,
						pointRadius: 0,
						borderColor: '#E75480',
						backgroundColor: '#E75480'
					},
					{
						label: 'Normal Distribution',

						data: dist.labels.map((x, i) => ({
							x: x,
							y: dist.curve[i]
						})),

						borderWidth: 3,
						pointRadius: 0,
						tension: 0.4,
						borderColor: 'rgb(10,100,255)',
						backgroundColor: 'rgba(0,0,255,0.1)',
						fill: true
					},
					{
						label: 'Target Value',

						data: [
							{x: target_x, y: 0},
							{x: target_x, y: maxY}
						],

						borderWidth: 3,
						pointRadius: 0,
						borderColor: 'rgb(10,100,255)',
						backgroundColor: 'rgb(10,100,255)'
					},
					{
						label: 'Probability Region',

						data: shadedRegion,

						borderWidth: 0,
						pointRadius: 0,

						backgroundColor: 'rgb(10,100,255)',

						fill: true,

						tension: 0.4
					},

				]

			},

			options: {

				responsive: true,

				plugins: {

					title: {
						display: true,
						text: `Z-Score = ${z}`
					}

				},

				scales: {

					x: {
						type: 'linear',
						title: {
							display: true,
							text: 'Values'
						}
					},

					y: {
						display: false
					}

				}

			}

		});



		steps_html = `
				<div class="steps-container">

					<h2>Z-Score Calculation</h2>

					<p>
						A z-score measures how many standard deviations a value lies
						from the mean of the dataset.
					</p>

					<h3>Formula:</h3>

					<p>
						\\[
						z = \\frac{x - \\mu}{\\sigma}
						\\]
					</p>

					<p>
						Where:
					</p>

					<p>
						\\[
						x = \\text{Target Value}
						\\]
					</p>

					<p>
						\\[
						\\mu = \\text{Mean}
						\\]
					</p>

					<p>
						\\[
						\\sigma = \\text{Standard Deviation}
						\\]
					</p>

					<h3>Raw Data:</h3>

					<p>
						\\[
						${data_y.join(', ')}
						\\]
					</p>

					<h3>Step 1: Calculate the Required Values</h3>

					<p>
						\\[
						x = ${target_x}
						\\]
					</p>

					<p>
						\\[
						\\mu = ${mean_y}
						\\]
					</p>

					<p>
						\\[
						\\sigma = ${sd}
						\\]
					</p>

					<h3>Step 2: Substitute into the Formula</h3>

					<p>
						\\[
						z =
						\\frac{
						${target_x} - ${mean_y}
						}{
						${sd}
						}
						\\]
					</p>

					<h3>Step 3: Simplify</h3>

					<p>
						\\[
						z =
						\\frac{
						${Math.round((target_x - mean_y) * 100000)/100000}
						}{
						${sd}
						}
						\\]
					</p>

					<p>
						\\[
						z = ${z}
						\\]
					</p>

					<h3>Interpretation</h3>

					<p>
						${
							z > 0
							? `The target value lies <b>${Math.abs(z)}</b> standard deviations above the mean.`
							: z < 0
							? `The target value lies <b>${Math.abs(z)}</b> standard deviations below the mean.`
							: `The target value is exactly equal to the mean.`
						}
					</p>

					<h3>Final Answer</h3>

					<p style="font-size:1.5em; font-weight:bold;">
						\\[
						z = ${z}
						\\]
					</p>

				</div>
			`;
	});

	steps.addEventListener("click",()=>{

		if(steps.textContent == "Show Steps"){

			ansSteps.innerHTML = steps_html;
			MathJax.typesetPromise();
			steps.textContent = "Hide Steps";
		}else if(steps.textContent = "Hide Steps"){

			ansSteps.innerHTML = ' ';
			steps.textContent = "Show Steps";
		}
	});




	</script>
</body>
</html>
