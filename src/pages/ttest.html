<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Statistics Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/jstat@latest/dist/jstat.min.js"></script>
    <script src="../scripts/statscalc.js"></script>
    <script src="../scripts/pdfGenerator.js"></script>
    <script src="../scripts/ui-components.js"></script>
    <script src="../scripts/theme.js"></script>
    <script src="../scripts/history.js"></script>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="container" style="height: 650px;">
        <div class="head">
            <h1>One-Sample t-Test</h1>
            <i class="fa-regular fa-circle-question" id="info"></i>
            <div id="infoBox"></div>
        </div>
        <h2>Testing a sample mean against a hypothesized value.</h2>

        <div class="row">
            <label>Mean:</label>
            <input type="text" name="m" id="p" placeholder="Enter Sample Mean" required>
            <div class="button-wrapper" style="margin-left: auto; margin-bottom: 1em;">
                <button id="generateData">
                    <i class="fa-solid fa-angles-up"></i>
                </button>
                <div class="dropdown" id="dropdown-generate">
                    <a id="generate">Generate Data</a>
                </div>
            </div>
        </div>
        <div class="row">
            <label>n:</label>
            <input type="text" name="y" id="n" placeholder="Enter Sample Size" required>
            <div class="button-wrapper" style="margin-left: auto;">
                <button id="exportPDF">
                    <i class="fa-solid fa-arrow-up-from-bracket"></i>
                </button>
                <div class="dropdown" style="bottom: 100%;" id="dropdown-export">
                    <a id="export">Export PDF</a>
                </div>
            </div>
        </div>
        <div class="row">
            <label>Type:</label>
            <select name="Choose Type" id="select">
                <option value="less">Hₐ: μ < μ₀ (Left-tailed)</option>
                <option value="more">Hₐ: μ > μ₀ (Right-tailed)</option>
                <option value="between">Hₐ: μ ≠ μ₀ (Two-tailed)</option>
            </select>
            <button style="background: transparent; cursor: default; margin-left: auto; width: 9%"></button>

        </div>
        <div class="row">
            <label>μ₀/X:</label>
            <input type="text" name="x" id="x" placeholder="Enter Hypothesized Mean" required>
            <button style="background: transparent; cursor: default; margin-left: auto; width: 9%"></button>

        </div>
        <div class="row">
            <label>SD:</label>
            <input type="text" name="s" id="s" placeholder="Enter Sample Standard Deviation" required>
            <button style="background: transparent; cursor: default; margin-left: auto; width: 9%"></button>

        </div>

        <button id="calculate">Generate</button>
    </div>

    <p id="answer"></p>

    <div class="graph">
        <canvas id="myChart"></canvas>
    </div>

    <button id="steps">Show Steps</button>
    <p id="ansSteps"></p>

    <script>
        let x = document.getElementById("x");
        let no = document.getElementById("n");
        let prob = document.getElementById("p");
        let sInput = document.getElementById("s");
        let submit = document.getElementById("calculate");
        let result = document.getElementById("answer");
        let steps = document.getElementById("steps");
        let ansSteps = document.getElementById("ansSteps");
        let my_chart = null;
        let options = document.getElementById("select");
        let steps_html;
        
        const info = document.getElementById("info");
        const infoBox = document.getElementById('infoBox');
        let hoverTimer;

        const genDataBtn = document.getElementById("generateData");
        const exportPdfBtn = document.getElementById("exportPDF");
        const dropdownGenerate = document.getElementById("dropdown-generate");
        const dropdownExport = document.getElementById("dropdown-export");
        const generate = document.getElementById("generate");
        let calc_values = null;

        const desc = `
                <h3>One-Sample t-Test</h3>
                <h4>
                    Tests whether the mean of a sample is significantly different from a hypothesized population mean.
                </h4>
                <ul>
                    <li><b>Sample Mean (x̄)</b> → Average of the sample data.</li>
                    <li><b>Sample Size (n)</b> → Number of observations.</li>
                    <li><b>Sample Std Dev (s)</b> → Standard deviation of the sample.</li>
                    <li><b>Hypothesized Mean (μ₀)</b> → The value being tested against.</li>
                    <li>Assumptions: Data approximately normally distributed or large n.</li>
                </ul>
            `;

        function showInfo(){
            infoBox.innerHTML = desc;
            infoBox.classList.add("show");
        }
        function hideInfo(){
            infoBox.innerHTML = "";
            infoBox.classList.remove("show");
        }
        info.addEventListener("mouseenter",()=>{
            hoverTimer = setTimeout(()=>{
                showInfo();
            },1000);
        });
        info.addEventListener("mouseleave",()=>{
            clearTimeout(hoverTimer);
        });
        info.addEventListener("click",(e)=>{
            e.stopPropagation();
            if(infoBox.classList.contains("show")){
                hideInfo();
            }else{
                showInfo();
            }
        });
        infoBox.addEventListener("mouseenter", () => {
            clearTimeout(hoverTimer);
        });
        infoBox.addEventListener("mouseleave", () => {
            hideInfo();
        });
        document.addEventListener("click", () => {
            hideInfo();
        });

        genDataBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownGenerate.classList.toggle('show');
            dropdownExport.classList.remove('show');
        });

        exportPdfBtn.addEventListener("click",(e) => {
            e.stopPropagation();
            dropdownExport.classList.toggle('show');
            dropdownGenerate.classList.remove('show');
        });

        document.addEventListener('click', () => {
            dropdownGenerate.classList.remove('show');
            dropdownExport.classList.remove('show');
        });

        generate.addEventListener("click",() => {
            const data = generateDataset(0,4,'sequential');
            prob.value = Math.round(data[1][0] * 10000)/10000;
            no.value = Math.floor(data[1][1]);
            x.value = Math.round(data[1][2] * 100000)/100000;
            sInput.value = Math.round(data[1][3] * 100000)/100000;
        });

        document.addEventListener("keydown",(e) => {
            if (e.key === 'Enter' && e.target.tagName !== "TEXTAREA"){
                e.preventDefault();
                submit.classList.add('active-pressed');
                setTimeout(()=> {
                    submit.classList.remove('active-pressed');
                }, 150);
                setTimeout(()=>{
                    submit.click();
                }, 20);
            }
        });

        restoreHistoryInputs();

        submit.addEventListener("click",()=>{
            ansSteps.innerHTML = ' ';
            steps.textContent = "Show Steps";
            if(my_chart){
                my_chart.destroy();
            }

            let val, n, xbar, s, mu0, t_stat, p_val, df;

            try{
                if(no.value.trim() === "" || prob.value.trim() === "" || x.value.trim() === "" || sInput.value.trim() === ""){
                    throw "Please enter all required data.";
                }
                
                let xbar_val = parseFloat(prob.value.trim());
                let n_val = parseInt(no.value.trim());
                let mu_val = parseFloat(x.value.trim());
                let s_val = parseFloat(sInput.value.trim());
                
                if(isNaN(xbar_val) || isNaN(n_val) || isNaN(mu_val) || isNaN(s_val) || n_val <= 1 || s_val <= 0){
                    throw "Invalid numerical inputs. Sample size must be > 1 and SD must be > 0.";
                }
                
                xbar = xbar_val;
                n = n_val;
                mu0 = mu_val;
                s = s_val;
            }catch(error){
                alert(error);
                return;
            }

            df = n - 1;
            t_stat = t_test_stat(xbar, mu0, s, n);
            p_val = calculate_t_pvalue(t_stat, df, options.value); 
            const difference = xbar - mu0;
            const se = s / Math.sqrt(n);
            let display_p_val = (p_val < 0.000001 ? p_val.toExponential(5) : p_val.toFixed(5));

            calc_values = {
                type: options.value,
                xbar: xbar,
                n: n,
                mu0: mu0,
                s: s,
                t_stat: t_stat,
                df: df,
                p_val: display_p_val,
                se: se
            };

            result.innerHTML = `
                <div style = "height: 8em;display: grid; text-align: center;grid-template-columns: auto auto auto; gap: 0 1em;
                 font-size: 2em; font-family: monospace;">
                    <span>t-statistic</span><span>:</span><span>${t_stat.toFixed(5)}</span>
                    <span>df</span><span>:</span><span>${df}</span>
                    <span>p-value</span><span>:</span><span>${display_p_val}</span>
                    <span>Std Error</span><span>:</span><span>${se.toFixed(5)}</span>
                </div>
            `;

            steps_html = `
                <div class="steps-container">

                <h2>One-Sample t-Test</h2>

                <p><b>Null Hypothesis:</b> \\(\\mu=${mu0}\\)</p>

                <p><b>Alternative Hypothesis:</b> ${
                options.value === "less"
                ? "\\(\\mu<" + mu0 + "\\)"
                : options.value === "more"
                ? "\\(\\mu>" + mu0 + "\\)"
                : "\\(\\mu\\neq" + mu0 + "\\)"
                }</p>

                <h3>Step 1: Formula</h3>

                <p>
                \\[
                t=
                \\frac{\\bar{x}-\\mu_0}
                {
                \\frac{s}{\\sqrt{n}}
                }
                \\]
                </p>

                <h3>Step 2: Sample Values</h3>

                <p>
                \\[
                \\bar{x}=${xbar},
                \\qquad
                \\mu_0=${mu0}
                \\]
                </p>

                <p>
                \\[
                s=${s},
                \\qquad
                n=${n}
                \\]
                </p>

                <h3>Step 3: Difference Between Means</h3>

                <p>
                \\[
                \\bar{x}-\\mu_0
                =
                ${xbar}
                -
                ${mu0}
                =
                ${difference.toFixed(5)}
                \\]
                </p>

                <h3>Step 4: Standard Error</h3>

                <p>
                \\[
                SE=
                \\frac{${s}}
                {\\sqrt{${n}}}
                =
                ${se.toFixed(5)}
                \\]
                </p>

                <h3>Step 5: Calculate the t-statistic</h3>

                <p>
                \\[
                t=
                \\frac{
                ${difference.toFixed(5)}
                }
                {
                ${se.toFixed(5)}
                }
                =
                ${t_stat.toFixed(5)}
                \\]
                </p>

                <h3>Step 6: Degrees of Freedom</h3>

                <p>
                \\[
                df=n-1=${n}-1=${df}
                \\]
                </p>

                <h3>Step 7: p-value</h3>

                <p>
                \\[
                p=
                ${display_p_val}
                \\]
                </p>

                <p>
                (${options.value === "between" ? "Two-tailed test" : "One-tailed test"})
                </p>

                <h3>Final Answer</h3>

                <p style="font-size:1.4em;font-weight:bold;">
                \\[
                t=${t_stat.toFixed(5)}
                \\]
                </p>

                <p style="font-size:1.4em;font-weight:bold;">
                \\[
                p=${display_p_val}
                \\]
                </p>

                </div>
            `;

            let limit = Math.max(4, Math.ceil(Math.abs(t_stat) + 1));
            let labels = [];
            let curve = [];

            saveHistory(
                "One-Sample t-Test",
                "src/pages/ttest.html",
                {
                    x : mu0,
                    n : n,
                    p : xbar,
                    s : s,
                    select : options.value
                },
                calc_values
                );

            for (let x = -limit; x <= limit; x += 0.05) {
                labels.push(x);
                curve.push(jStat.studentt.pdf(x, df));
            }

            let maxY = Math.max(...curve);
            let shadedRegion = labels.map((x, i) => {
                let shade = false;
                if (options.value === "less") {
                    shade = (x <= t_stat);
                } else if (options.value === "more") {
                    shade = (x >= t_stat);
                } else {
                    shade = (Math.abs(x) >= Math.abs(t_stat));
                }
                return {
                    x: x,
                    y: shade ? curve[i] : null
                };
            });

            my_chart = new Chart("myChart", {
                type: "line",
                data: {
                    datasets: [
                        {
                            label: "Null Hypothesis",
                            data: [
                                { x: 0, y: 0 },
                                { x: 0, y: maxY }
                            ],
                            borderWidth: 3,
                            pointRadius: 0,
                            borderColor: "#E75480",
                            backgroundColor: "#E75480"
                        },
                        {
                            label: "t Distribution",
                            data: labels.map((x, i) => ({
                                x: x,
                                y: curve[i]
                            })),
                            borderWidth: 3,
                            pointRadius: 0,
                            tension: 0.4,
                            borderColor: "rgb(10,100,255)",
                            backgroundColor: "rgba(0,0,255,0.1)",
                            fill: true
                        },
                        {
                            label: "Observed t",
                            data: [
                                { x: t_stat, y: 0 },
                                { x: t_stat, y: maxY }
                            ],
                            borderWidth: 3,
                            pointRadius: 0,
                            borderColor: "rgb(10,100,255)",
                            backgroundColor: "rgb(10,100,255)"
                        },
                        {
                            label: "P-value Region",
                            data: shadedRegion,
                            borderWidth: 0,
                            pointRadius: 0,
                            backgroundColor: "rgb(10,100,255)",
                            fill: true,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    devicePixelRatio: 4,
                    plugins: {
                        title: {
                            display: true,
                            text: `t = ${t_stat.toFixed(4)}     p = ${display_p_val}`
                        }
                    },
                    scales: {
                        x: {
                            type: "linear",
                            title: {
                                display: true,
                                text: "t Statistic"
                            }
                        },
                        y: {
                            display: false
                        }
                    }
                }
            });

            steps.style.display = "block";
        });

        steps.addEventListener("click",()=>{
            if(steps.textContent == "Show Steps"){
                ansSteps.innerHTML = steps_html;
                MathJax.typesetPromise();
                steps.textContent = "Hide Steps";
            }else if(steps.textContent == "Hide Steps"){
                ansSteps.innerHTML = ' ';
                steps.textContent = "Show Steps";
            }
        });

        document.getElementById("export").addEventListener("click", async () => {
            if (!calc_values) {
                alert("Please run the calculation first!");
                return;
            }

            const exportBtn = document.getElementById("export");
            const originalText = exportBtn.innerText;
            exportBtn.innerText = "Saving PDF...";
            exportBtn.style.pointerEvents = "none";

            let hypothesisText = "";
            if (calc_values.type === 'less') hypothesisText = `Hₐ: μ < ${calc_values.mu0}`;
            else if (calc_values.type === 'more') hypothesisText = `Hₐ: μ > ${calc_values.mu0}`;
            else hypothesisText = `Hₐ: μ ≠ ${calc_values.mu0}`;

            await generateModularPDF({
                title: "One-Sample t-Test Analysis",
                datasetHTML: `
                    <p style="margin: 0 0 10px 0;"><strong>Sample Mean (x̄):</strong> ${calc_values.xbar}</p>
                    <p style="margin: 0 0 10px 0;"><strong>Sample Size (n):</strong> ${calc_values.n}</p>
                    <p style="margin: 0 0 10px 0;"><strong>Sample Std Dev (s):</strong> ${calc_values.s}</p>
                    <p style="margin: 0;"><strong>Hypothesized Mean (μ₀):</strong> ${calc_values.mu0}</p>
                `,
                resultsHTML: `
                    <div style="font-size: 18px; padding: 18px; background: #f0f7ff; text-align: center; border-radius: 8px; border: 1px solid #cce0ff; line-height: 2;">
                        <p style="margin: 0;"><strong>Hypothesis:</strong> ${hypothesisText}</p>
                        <p style="margin: 0;"><strong>t-Statistic:</strong> ${calc_values.t_stat.toFixed(5)}</p>
                        <p style="margin: 0;"><strong>Degrees of Freedom (df):</strong> ${calc_values.df}</p>
                        <p style="margin: 0;"><strong>Standard Error (SE):</strong> ${calc_values.se.toFixed(5)}</p>
                        <p style="margin: 0; font-weight: bold;"><strong>p-value:</strong> ${calc_values.p_val}</p>
                    </div>
                `,
                chartCanvasId: "myChart",
                stepsHTML: steps_html
            });

            exportBtn.innerText = originalText;
            exportBtn.style.pointerEvents = "auto";
        });

    </script>
</body>
</html>
