<!DOCTYPE html>

<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Statistics Calculator</title>
<script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<script src="https://cdn.jsdelivr.net/npm/jstat@latest/dist/jstat.min.js"></script>

<script src="../scripts/statscalc.js"></script>
<script src="../scripts/pdfGenerator.js"></script>
<script src="../scripts/ui-components.js"></script>
<script src="../scripts/theme.js"></script>
<script src="../scripts/history.js"></script>

<link rel="stylesheet" type="text/css" href="styles.css">
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="head">
        <h1>Poisson Distribution</h1>

        <i class="fa-regular fa-circle-question" id="info"></i>
        <div id="infoBox"></div>
    </div>

    <h2>Models the number of events occurring in a fixed interval at a constant average rate.</h2>

    <div class="row">
        <label>λ:</label>

        <input
            type="text"
            name="lambda"
            id="lambda"
            placeholder="Enter average rate (λ)"
            required
        >

        <div class="button-wrapper"
             style="margin-left: auto; margin-bottom: 1em;">

            <button id="generateData">
                <i class="fa-solid fa-angles-up"></i>
            </button>

            <div class="dropdown" id="dropdown-generate">
                <a id="generate">Generate Data</a>
            </div>

        </div>
    </div>

    <div class="row">

        <label>X:</label>

        <input
            type="text"
            name="x"
            id="x"
            placeholder="Enter target X value"
            required
        >

        <div class="button-wrapper" style="margin-left: auto;">

            <button id="exportPDF">
                <i class="fa-solid fa-arrow-up-from-bracket"></i>
            </button>

            <div class="dropdown"
                 style="bottom: 100%;"
                 id="dropdown-export">

                <a id="export">Export PDF</a>

            </div>

        </div>

    </div>

    <button id="calculate">Generate</button>

</div>


<p id="answer"></p>


<div class="graph">
    <canvas id="myChart"></canvas>
</div>


<button id="steps">Show Steps</button>

<p id="ansSteps"></p>


<script>

    const x = document.getElementById("x");
    const lambda = document.getElementById("lambda");

    const submit = document.getElementById("calculate");

    const result = document.getElementById("answer");

    const steps = document.getElementById("steps");
    const ansSteps = document.getElementById("ansSteps");

    const info = document.getElementById("info");
    const infoBox = document.getElementById("infoBox");

    const genDataBtn = document.getElementById("generateData");
    const exportPdfBtn = document.getElementById("exportPDF");

    const dropdownGenerate =
        document.getElementById("dropdown-generate");

    const dropdownExport =
        document.getElementById("dropdown-export");

    const generate =
        document.getElementById("generate");


    let my_chart = null;
    let steps_html = "";
    let calc_values = null;
    let hoverTimer;

    const desc = `
        <h3>Poisson Distribution</h3>

        <h4>
            A discrete probability distribution used to model the
            number of times an event occurs within a fixed interval
            when events happen independently at a constant average rate.
        </h4>

        <ul>

            <li>
                <b>λ (Lambda)</b> → The average number of events
                expected in the interval.
            </li>

            <li>
                <b>X</b> → The number of events being considered.
                X must be a non-negative integer.
            </li>

            <li>
                <b>Probability</b> → The probability of observing
                exactly X events is given by the Poisson probability
                mass function.
            </li>

            <li>
                <b>Mean</b> → The mean of a Poisson distribution is λ.
            </li>

            <li>
                <b>Standard Deviation</b> → The standard deviation
                is √λ.
            </li>

            <li>
                The Poisson distribution is commonly used for counting
                events such as arrivals, calls, defects, accidents,
                or occurrences within a fixed interval.
            </li>

        </ul>
    `;


    function showInfo() {

        infoBox.innerHTML = desc;
        infoBox.classList.add("show");

    }


    function hideInfo() {

        infoBox.innerHTML = "";
        infoBox.classList.remove("show");

    }


    info.addEventListener("mouseenter", () => {

        hoverTimer = setTimeout(() => {

            showInfo();

        }, 1000);

    });


    info.addEventListener("mouseleave", () => {

        clearTimeout(hoverTimer);

    });


    info.addEventListener("click", (e) => {

        e.stopPropagation();

        if (infoBox.classList.contains("show")) {

            hideInfo();

        } else {

            showInfo();

        }

    });


    infoBox.addEventListener("mouseenter", () => {

        clearTimeout(hoverTimer);

    });


    infoBox.addEventListener("mouseleave", () => {

        hideInfo();

    });


    document.addEventListener("click", () => {

        hideInfo();

    });

    genDataBtn.addEventListener("click", (e) => {

        e.stopPropagation();

        dropdownGenerate.classList.toggle("show");

        dropdownExport.classList.remove("show");

    });


    exportPdfBtn.addEventListener("click", (e) => {

        e.stopPropagation();

        dropdownExport.classList.toggle("show");

        dropdownGenerate.classList.remove("show");

    });


    document.addEventListener("click", () => {

        dropdownGenerate.classList.remove("show");
        dropdownExport.classList.remove("show");

    });

    generate.addEventListener("click", () => {
        const generatedLambda =
            Math.floor(Math.random() * 10) + 1;

        const generatedX =
            Math.max(
                0,
                Math.round(
                    generatedLambda +
                    (Math.random() - 0.5) *
                    Math.sqrt(generatedLambda) * 2
                )
            );

        x.value = generatedX;
        lambda.value = generatedLambda;

    });

    document.addEventListener("keydown", (e) => {

        if (
            e.key === "Enter" &&
            e.target.tagName !== "TEXTAREA"
        ) {

            e.preventDefault();

            submit.classList.add("active-pressed");

            setTimeout(() => {

                submit.classList.remove("active-pressed");

            }, 150);

            setTimeout(() => {

                submit.click();

            }, 20);

        }

    });

    restoreHistoryInputs();

    submit.addEventListener("click", () => {

        ansSteps.innerHTML = "";
        steps.textContent = "Show Steps";
        steps_html = "";

        if (my_chart) {

            my_chart.destroy();
            my_chart = null;

        }

        let x_value;
        let lamb;

        try {

            if (
                lambda.value.trim() === "" ||
                x.value.trim() === ""
            ) {

                throw "Please enter some data.";

            }


            x_value =
                lambda.value.trim() === ""
                    ? []
                    : x.value
                        .trim()
                        .split(/[\x1f\s,]+/)
                        .map(Number);


            lamb =
                lambda.value.trim()
                    .split(/[\x1f\s,]+/)
                    .map(Number);


            if (x_value.length > 1) {

                throw "Only one X value is allowed.";

            }


            if (lamb.length > 1) {

                throw "Only one Lambda value is allowed.";

            }


            if (
                x_value.some(Number.isNaN) ||
                lamb.some(Number.isNaN)
            ) {

                throw "Only numerical values are allowed.";

            }


            if (!Number.isInteger(x_value[0])) {

                throw "X must be a non-negative integer.";

            }


            if (x_value[0] < 0) {

                throw "X must be a non-negative integer.";

            }


            if (lamb[0] <= 0) {

                throw "Lambda (λ) must be greater than 0.";

            }

        }
        catch (error) {

            alert(error);
            return;

        }

        const xNum = x_value[0];
        const lambdaNum = lamb[0];

        const results =
            poisson_dist(xNum, lambdaNum);


        const prob = results[0];
        const sd = results[1];
        const mean = lambdaNum;

        result.innerHTML = `

            <div
                style="
                    min-height: 6em;
                    display: grid;
                    text-align: center;
                    grid-template-columns:
                        auto auto auto;
                    align-items: center;
                    gap: 0 1em;
                    font-size: 2em;
                    font-family: monospace;
                "
            >

                <span>Probability</span>
                <span>:</span>
                <span>${prob.toFixed(5)}</span>


                <span>Mean</span>
                <span>:</span>
                <span>${mean.toFixed(5)}</span>


                <span>Standard Deviation</span>
                <span>:</span>
                <span>${sd.toFixed(5)}</span>

            </div>

        `;

        calc_values = {

            x: xNum,

            lambda: lambdaNum,

            prob: prob,

            mean: mean,

            sd: sd

        };

        saveHistory(

            "Poisson Distribution",

            "src/pages/poisson.html",

            {
                x: xNum,
                lambda: lambdaNum
            },

            calc_values

        );


        steps.style.display = "block";

        const chartMax =
            Math.max(
                xNum + 4,
                Math.ceil(
                    lambdaNum +
                    4 * Math.sqrt(lambdaNum)
                ),
                8
            );


        const chartLabels = [];
        const chartProbabilities = [];


        for (let i = 0; i <= chartMax; i++) {

            chartLabels.push(i);

            const p =
                poisson_dist(i, lambdaNum)[0];

            chartProbabilities.push(p);

        }


        const maxY =
            Math.max(...chartProbabilities);


        my_chart = new Chart(

            document.getElementById("myChart"),

            {

                type: "bar",

                data: {

                    labels: chartLabels,

                    datasets: [

                        {

                            label: "P(X = x)",

                            data: chartProbabilities,

                            borderWidth: 1,

                            backgroundColor:
                                chartLabels.map(value =>
                                    value === xNum
                                        ? "#E75480"
                                        : "rgba(10,100,255,0.35)"
                                ),

                            borderColor:
                                chartLabels.map(value =>
                                    value === xNum
                                        ? "#E75480"
                                        : "rgb(10,100,255)"
                                )

                        }

                    ]

                },


                options: {

                    responsive: true,

                    devicePixelRatio: 4,

                    plugins: {

                        legend: {

                            display: true

                        },

                        tooltip: {

                            callbacks: {

                                label: function(context) {

                                    return (
                                        " P(X = " +
                                        context.label +
                                        ") = " +
                                        Number(
                                            context.raw
                                        ).toFixed(8)
                                    );

                                }

                            }

                        }

                    },


                    scales: {

                        x: {

                            title: {

                                display: true,

                                text: "Number of Events (X)"

                            },

                            ticks: {

                                precision: 0

                            }

                        },


                        y: {

                            beginAtZero: true,

                            suggestedMax:
                                maxY * 1.15,

                            title: {

                                display: true,

                                text: "Probability"

                            },

                            ticks: {

                                callback: function(value) {

                                    return Number(value)
                                        .toFixed(2);

                                }

                            }

                        }

                    }

                }

            }

        );


        steps_html = `

            <div class="steps-container">

                <h3>Poisson Distribution</h3>


                <p>
                    The Poisson probability mass function is:
                </p>

                <p>
                    \\[
                    P(X=x)
                    =
                    \\frac{e^{-\\lambda}\\lambda^x}{x!}
                    \\]
                </p>


                <h4>1. Identify the values</h4>

                <p>
                    Target value:
                    \\[
                    x = ${xNum}
                    \\]
                </p>

                <p>
                    Average rate:
                    \\[
                    \\lambda = ${lambdaNum}
                    \\]
                </p>


                <h4>2. Substitute into the formula</h4>

                <p>
                    \\[
                    P(X=${xNum})
                    =
                    \\frac{
                        e^{-${lambdaNum}}
                        (${lambdaNum})^{${xNum}}
                    }{
                        ${xNum}!
                    }
                    \\]
                </p>


                <h4>3. Calculate the factorial</h4>

                <p>
                    \\[
                    ${xNum}! =
                    ${factorial(xNum)}
                    \\]
                </p>


                <h4>4. Calculate the probability</h4>

                <p>
                    \\[
                    P(X=${xNum})
                    =
                    ${prob.toFixed(8)}
                    \\]
                </p>


                <h4>5. Calculate the mean</h4>

                <p>
                    For a Poisson distribution:
                </p>

                <p>
                    \\[
                    \\mu = \\lambda
                    \\]
                </p>

                <p>
                    Therefore:
                </p>

                <p>
                    \\[
                    \\mu = ${lambdaNum}
                    \\]
                </p>


                <h4>6. Calculate the standard deviation</h4>

                <p>
                    For a Poisson distribution:
                </p>

                <p>
                    \\[
                    \\sigma = \\sqrt{\\lambda}
                    \\]
                </p>

                <p>
                    Therefore:
                </p>

                <p>
                    \\[
                    \\sigma
                    =
                    \\sqrt{${lambdaNum}}
                    =
                    ${sd.toFixed(8)}
                    \\]
                </p>


                <h4>Final Result</h4>

                <p>
                    The probability of observing exactly
                    <b>${xNum}</b> events when the average rate is
                    <b>${lambdaNum}</b> is:
                </p>

                <p>
                    \\[
                    
                        P(X=${xNum})
                        =
                        ${prob.toFixed(8)}
                    
                    \\]
                </p>

            </div>

        `;

    });


    steps.addEventListener("click", () => {

        if (steps.textContent === "Show Steps") {

            ansSteps.innerHTML = steps_html;

            MathJax.typesetPromise();

            steps.textContent = "Hide Steps";

        }

        else if (steps.textContent === "Hide Steps") {

            ansSteps.innerHTML = "";

            steps.textContent = "Show Steps";

        }

    });

    document
        .getElementById("export")
        .addEventListener("click", async () => {

            if (!calc_values) {

                alert("Please run the calculation first!");

                return;

            }


            const exportBtn =
                document.getElementById("export");


            const originalText =
                exportBtn.innerText;


            exportBtn.innerText =
                "Saving PDF...";


            exportBtn.style.pointerEvents =
                "none";


            try {

                const resultsHTML = `

                    <div
                        style="
                            font-size: 18px;
                            padding: 18px;
                            background: #f0f7ff;
                            text-align: center;
                            border-radius: 8px;
                            border: 1px solid #cce0ff;
                            line-height: 2;
                        "
                    >

                        <p style="margin: 0;">
                            <strong>
                                P(X = ${calc_values.x}):
                            </strong>

                            ${calc_values.prob.toFixed(8)}
                        </p>


                        <p style="margin: 0;">
                            <strong>
                                Mean:
                            </strong>

                            ${calc_values.mean}
                        </p>


                        <p style="margin: 0;">
                            <strong>
                                Standard Deviation:
                            </strong>

                            ${calc_values.sd.toFixed(8)}
                        </p>

                    </div>

                `;


                await generateModularPDF({

                    title:
                        "Poisson Distribution Analysis",


                    datasetHTML: `

                        <p
                            style="
                                margin: 0 0 10px 0;
                            "
                        >
                            <strong>
                                Average Rate (λ):
                            </strong>

                            ${lambda.value.trim()}
                        </p>


                        <p style="margin: 0;">

                            <strong>
                                Target X:
                            </strong>

                            ${x.value.trim()}

                        </p>

                    `,


                    resultsHTML:
                        resultsHTML,


                    chartCanvasId:
                        "myChart",


                    stepsHTML:
                        steps_html

                });

            }

            catch (error) {

                console.error(
                    "PDF export failed:",
                    error
                );

                alert(
                    "Unable to export the PDF."
                );

            }

            finally {

                exportBtn.innerText =
                    originalText;

                exportBtn.style.pointerEvents =
                    "auto";

            }

        });

</script>

</body>
</html>
