<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Statistics Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/jstat@latest/dist/jstat.min.js"></script>
    <script src="../scripts/statscalc.js"></script>
    <script src="../scripts/pdfGenerator.js"></script>
    <script src="../scripts/ui-components.js"></script>
    <script src="../scripts/theme.js"></script>
    <script src="../scripts/history.js"></script>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="container" style="height: 650px;">
        <div class="head">
            <h1>Confidene Interval</h1>
            <i class="fa-regular fa-circle-question" id="info"></i>
            <div id="infoBox"></div>
        </div>
        <h2>The range you can rely on, instead of a single value.</h2>

        <div class="row">
            <label>Mean:</label>
            <input type="text" name="m" id="x" placeholder="Enter Sample Mean" required>
            <div class="button-wrapper" style="margin-left: auto; margin-bottom: 1em;">
                <button id="generateData">
                    <i class="fa-solid fa-angles-up"></i>
                </button>
                <div class="dropdown" id="dropdown-generate">
                    <a id="generate">Generate Data</a>
                </div>
            </div>
        </div>
        <div class="row">
            <label>n:</label>
            <input type="text" name="y" id="n" placeholder="Enter Sample Size" required>
            <div class="button-wrapper" style="margin-left: auto;">
                <button id="exportPDF">
                    <i class="fa-solid fa-arrow-up-from-bracket"></i>
                </button>
                <div class="dropdown" style="bottom: 100%;" id="dropdown-export">
                    <a id="export">Export PDF</a>
                </div>
            </div>
        </div>
        <div class="row">
            <label>SD:</label>
            <input type="text" name="s" id="s" placeholder="Enter Standard Deviation" required>
            <button style="background: transparent; cursor: default; margin-left: auto; width: 9%"></button>

        </div>

        <div class="row">
            <label>Conf.:</label>
            <input type="text" name="s1" id="cl" placeholder="Enter confidence level(95,99 etc)" required>
            <button style="background: transparent; cursor: default; margin-left: auto; width: 9%"></button>

        </div>

        <button id="calculate">Generate</button>
    </div>

    <p id="answer"></p>

    <div class="graph">
        <canvas id="myChart"></canvas>
    </div>

    <button id="steps">Show Steps</button>
    <p id="ansSteps"></p>

    <script>
        let x = document.getElementById("x");
        let no = document.getElementById("n");
        let sInput = document.getElementById("s");
        let cl = document.getElementById("cl");
        let submit = document.getElementById("calculate");
        let result = document.getElementById("answer");
        let steps = document.getElementById("steps");
        let ansSteps = document.getElementById("ansSteps");
        let my_chart = null;
        let options = document.getElementById("select");
        let steps_html;
        
        const info = document.getElementById("info");
        const infoBox = document.getElementById('infoBox');
        let hoverTimer;

        const genDataBtn = document.getElementById("generateData");
        const exportPdfBtn = document.getElementById("exportPDF");
        const dropdownGenerate = document.getElementById("dropdown-generate");
        const dropdownExport = document.getElementById("dropdown-export");
        const generate = document.getElementById("generate");
        let calc_values = null;

        const desc = `
            <h3>Confidence Interval for a Population Mean</h3>
            <h4>
                Estimates a range of plausible values for the population mean
                at a chosen confidence level.
            </h4>
            <ul>
                <li><b>Sample Mean (x̄)</b> → Average of the sample data.</li>
                <li><b>Sample Size (n)</b> → Number of observations.</li>
                <li><b>Sample Std Dev (s)</b> → Standard deviation of the sample.</li>
                <li><b>Confidence Level</b> → How confident we are that the interval contains the population mean.</li>
                <li>Uses the <b>t-distribution</b> with <b>n − 1</b> degrees of freedom.</li>
            </ul>
        `;

        function showInfo(){
            infoBox.innerHTML = desc;
            infoBox.classList.add("show");
        }
        function hideInfo(){
            infoBox.innerHTML = "";
            infoBox.classList.remove("show");
        }
        info.addEventListener("mouseenter",()=>{
            hoverTimer = setTimeout(()=>{
                showInfo();
            },1000);
        });
        info.addEventListener("mouseleave",()=>{
            clearTimeout(hoverTimer);
        });
        info.addEventListener("click",(e)=>{
            e.stopPropagation();
            if(infoBox.classList.contains("show")){
                hideInfo();
            }else{
                showInfo();
            }
        });
        infoBox.addEventListener("mouseenter", () => {
            clearTimeout(hoverTimer);
        });
        infoBox.addEventListener("mouseleave", () => {
            hideInfo();
        });
        document.addEventListener("click", () => {
            hideInfo();
        });

        genDataBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownGenerate.classList.toggle('show');
            dropdownExport.classList.remove('show');
        });

        exportPdfBtn.addEventListener("click",(e) => {
            e.stopPropagation();
            dropdownExport.classList.toggle('show');
            dropdownGenerate.classList.remove('show');
        });

        document.addEventListener('click', () => {
            dropdownGenerate.classList.remove('show');
            dropdownExport.classList.remove('show');
        });

        generate.addEventListener("click",() => {
            const data = generateDataset(0,4,'sequential');
            no.value = Math.floor(data[1][1]);
            x.value = Math.round(data[1][2] * 100000)/100000;
            sInput.value = Math.round(data[1][3] * 100000)/100000;
            cl.value = 95;
        });

        document.addEventListener("keydown",(e) => {
            if (e.key === 'Enter' && e.target.tagName !== "TEXTAREA"){
                e.preventDefault();
                submit.classList.add('active-pressed');
                setTimeout(()=> {
                    submit.classList.remove('active-pressed');
                }, 150);
                setTimeout(()=>{
                    submit.click();
                }, 20);
            }
        });

        restoreHistoryInputs();

        submit.addEventListener("click", () => {

            ansSteps.innerHTML = "";
            steps.textContent = "Show Steps";

            if (my_chart) {
                my_chart.destroy();
                my_chart = null;
            }

            let xbar, n, s, confidence;
            let se, critical, margin;
            let lower, upper;

            try {
                if (
                    x.value.trim() === "" ||
                    no.value.trim() === "" ||
                    sInput.value.trim() === "" ||
                    cl.value.trim() === ""
                ) {
                    throw "Please enter all required data.";
                }

                xbar = parseFloat(x.value.trim());
                n = parseInt(no.value.trim());
                s = parseFloat(sInput.value.trim());
                confidence = parseFloat(cl.value.trim());

                if (
                    isNaN(xbar) ||
                    isNaN(n) ||
                    isNaN(s) ||
                    isNaN(confidence)
                ) {
                    throw "Please enter valid numerical values.";
                }

                if (n <= 1) {
                    throw "Sample size must be greater than 1.";
                }

                if (s <= 0) {
                    throw "Standard deviation must be greater than 0.";
                }

                if (confidence <= 0 || confidence >= 100) {
                    throw "Confidence level must be between 0 and 100%.";
                }

            } catch (error) {
                alert(error);
                return;
            }

            let cl_decimal = confidence / 100;
            let data = confidence_interval(xbar,n,s,cl_decimal);

            lower = data[0];
            upper = data[1];
            se = data[2];
            margin = data[3];
            critical = data[4];

            calc_values = {
                xbar : xbar,
                n : n,
                s : s,
                confidence: confidence,
                se: se,
                margin: margin,
                critical: critical,
                lower: lower,
                upper: upper
            };

            result.innerHTML = `
                <div style = "height: 8em;display: grid; text-align: center;grid-template-columns: auto auto auto; gap: 0 1em;
                 font-size: 2em; font-family: monospace;">
                    <span>Confidence Level:</span><span>:</span><span>${confidence}%</span>
                    <span>Range</span><span>:</span><span>${lower.toFixed(3)} - ${upper.toFixed(3)}</span>
                    <span>Margin of Error:</span><span>:</span><span>${margin.toFixed(5)}</span>
                    <span>Std Error</span><span>:</span><span>${se.toFixed(5)}</span>
                </div>
            `;

            steps_html = `
                <div class="steps-container">

                    <h2>Confidence Interval</h2>

                    <h3>Step 1: Formula</h3>

                    <p>
                    The confidence interval for the population mean is:
                    </p>

                    <p>
                    \\[
                    \\bar{x}
                    \\pm
                    \\text{Critical Value}
                    \\times
                    \\frac{s}{\\sqrt{n}}
                    \\]
                    </p>

                    <h3>Step 2: Sample Values</h3>

                    <p>
                    \\[
                    \\bar{x}=${xbar},
                    \\qquad
                    n=${n},
                    \\qquad
                    s=${s}
                    \\]
                    </p>

                    <p>
                    Confidence Level:
                    \\[
                    ${confidence}\\%
                    \\]
                    </p>

                    <h3>Step 3: Standard Error</h3>

                    <p>
                    \\[
                    SE=
                    \\frac{s}{\\sqrt{n}}
                    \\]
                    </p>

                    <p>
                    \\[
                    SE=
                    \\frac{${s}}{\\sqrt{${n}}}
                    =
                    ${se.toFixed(5)}
                    \\]
                    </p>

                    <h3>Step 4: Select the Distribution</h3>

                    ${
                        n >= 30
                        ? `
                            <p>
                            Since:
                            \\[
                            n=${n}\\geq30
                            \\]
                            the <b>standard normal distribution</b> is used.
                            </p>

                            <p>
                            Therefore, the critical value is obtained from the
                            standard normal distribution.
                            </p>
                        `
                        : `
                            <p>
                            Since:
                            \\[
                            n=${n}<30
                            \\]
                            the <b>t-distribution</b> is used.
                            </p>

                            <p>
                            The degrees of freedom are:
                            \\[
                            df=n-1=${n}-1=${n-1}
                            \\]
                            </p>
                        `
                    }

                    <h3>Step 5: Critical Value</h3>

                    <p>
                    The confidence level is ${confidence}%, so the probability
                    used to find the critical value is:
                    </p>

                    <p>
                    \\[
                    P=
                    1-
                    \\frac{1-${cl_decimal}}
                    {2}
                    =
                    ${(1 - ((1 - cl_decimal) / 2)).toFixed(5)}
                    \\]
                    </p>

                    ${
                        n >= 30
                        ? `
                            <p>
                            Using the standard normal distribution:
                            \\[
                            z^*=
                            ${(margin / se).toFixed(5)}
                            \\]
                            </p>
                        `
                        : `
                            <p>
                            Using the t-distribution with
                            \\[
                            df=${n - 1}
                            \\]
                            the critical value is:
                            </p>

                            <p>
                            \\[
                            t^*=
                            ${(margin / se).toFixed(5)}
                            \\]
                            </p>
                        `
                    }

                    <h3>Step 6: Margin of Error</h3>

                    <p>
                    The margin of error is:
                    </p>

                    <p>
                    \\[
                    E=
                    \\text{Critical Value}\\times SE
                    \\]
                    </p>

                    <p>
                    \\[
                    E=
                    ${critical.toFixed(5)}
                    \\times
                    ${se.toFixed(5)}
                    =
                    ${margin.toFixed(5)}
                    \\]
                    </p>

                    <h3>Step 7: Confidence Interval</h3>

                    <p>
                    Lower Bound:
                    </p>

                    <p>
                    \\[
                    \\bar{x}-E
                    =
                    ${xbar}
                    -
                    ${margin.toFixed(5)}
                    =
                    ${lower.toFixed(5)}
                    \\]
                    </p>

                    <p>
                    Upper Bound:
                    </p>

                    <p>
                    \\[
                    \\bar{x}+E
                    =
                    ${xbar}
                    +
                    ${margin.toFixed(5)}
                    =
                    ${upper.toFixed(5)}
                    \\]
                    </p>

                    <h3>Final Answer</h3>

                    <p style="font-size:1.4em;font-weight:bold;">
                    \\[
                    ${confidence}\\%\\ CI
                    =
                    [${lower.toFixed(5)},\\ ${upper.toFixed(5)}]
                    \\]
                    </p>

                    <p>
                    Therefore, we are ${confidence}% confident that the
                    population mean lies between
                    <b>${lower.toFixed(5)}</b> and
                    <b>${upper.toFixed(5)}</b>.
                    </p>

                </div>
            `;

            saveHistory(
                "Confidence Interval",
                "src/pages/confidence.html",
                {
                    x: xbar,
                    n: n,
                    s: s,
                    cl: confidence
                },
                calc_values
            );

            const axisRange = Math.max(
                Math.abs(xbar) * 0.25,
                margin * 5,
                1
            );

            const chartMin = xbar - axisRange;
            const chartMax = xbar + axisRange;

            my_chart = new Chart("myChart", {
                type: "line",
                data: {
                    datasets: [
                        {
                            label: "Confidence Interval",
                            data: [
                                { x: lower, y: 0 },
                                { x: upper, y: 0 }
                            ],
                            borderWidth: 6,
                            pointRadius: 7,
                            showLine: true
                        },
                        {
                            label: "Sample Mean",
                            data: [
                                { x: xbar, y: -0.15 },
                                { x: xbar, y: 0.15 }
                            ],
                            borderWidth: 3,
                            pointRadius: 0,
                            showLine: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    devicePixelRatio: 4,

                    plugins: {
                        title: {
                            display: true,
                            text:
                                `${confidence}% CI: [${lower.toFixed(4)}, ${upper.toFixed(4)}]`
                        }
                    },

                    scales: {
                        x: {
                            type: "linear",
                            min: chartMin,
                            max: chartMax,
                            title: {
                                display: true,
                                text: "Population Mean"
                            }
                        },

                        y: {
                            display: false,
                            min: -0.3,
                            max: 0.3
                        }
                    }
                }
            });

            steps.style.display = "block";
        });

        steps.addEventListener("click",()=>{
            if(steps.textContent == "Show Steps"){
                ansSteps.innerHTML = steps_html;
                MathJax.typesetPromise();
                steps.textContent = "Hide Steps";
            }else if(steps.textContent == "Hide Steps"){
                ansSteps.innerHTML = ' ';
                steps.textContent = "Show Steps";
            }
        });

        document.getElementById("export").addEventListener("click", async () => {

            if (!calc_values) {
                alert("Please run the calculation first!");
                return;
            }

            const exportBtn = document.getElementById("export");
            const originalText = exportBtn.innerText;

            exportBtn.innerText = "Saving PDF...";
            exportBtn.style.pointerEvents = "none";

            await generateModularPDF({

                title: "Confidence Interval Analysis",

                datasetHTML: `
                    <p style="margin: 0 0 10px 0;">
                        <strong>Sample Mean (x̄):</strong>
                        ${calc_values.xbar}
                    </p>

                    <p style="margin: 0 0 10px 0;">
                        <strong>Sample Size (n):</strong>
                        ${calc_values.n}
                    </p>

                    <p style="margin: 0 0 10px 0;">
                        <strong>Standard Dev (s):</strong>
                        ${calc_values.s}
                    </p>

                    <p style="margin: 0;">
                        <strong>Confidence Level:</strong>
                        ${calc_values.confidence}%
                    </p>
                `,

                resultsHTML: `
                    <div style="
                        font-size: 18px;
                        padding: 18px;
                        background: #f0f7ff;
                        text-align: center;
                        border-radius: 8px;
                        border: 1px solid #cce0ff;
                        line-height: 2;
                    ">

                        <p style="margin: 0;">
                            <strong>Confidence Level:</strong>
                            ${calc_values.confidence}%
                        </p>

                        <p style="margin: 0;">
                            <strong>Standard Error:</strong>
                            ${calc_values.se.toFixed(5)}
                        </p>

                        <p style="margin: 0;">
                            <strong>Critical t-value:</strong>
                            ${calc_values.critical.toFixed(5)}
                        </p>

                        <p style="margin: 0;">
                            <strong>Margin of Error:</strong>
                            ±${calc_values.margin.toFixed(5)}
                        </p>

                        <p style="margin: 0; font-weight: bold;">
                            <strong>Confidence Interval:</strong>
                            [${calc_values.lower.toFixed(5)},
                            ${calc_values.upper.toFixed(5)}]
                        </p>

                    </div>
                `,

                chartCanvasId: "myChart",
                stepsHTML: steps_html
            });

            exportBtn.innerText = originalText;
            exportBtn.style.pointerEvents = "auto";
        });

    </script>
</body>
</html>
