<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Statistics Calculator</title>
	<script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  	<script id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  	</script>
	<script src="../scripts/statscalc.js"></script>
	<script src="../scripts/bifurdata.js"></script>
	<link rel="stylesheet" type="text/css" href="styles.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
	

</head>


<body>

	<div class="container">
		
		
		<div class="head">
			<h1>Logistic Map</h1>
			<i class="fa-regular fa-circle-question" id="info"></i>
			<div id="infoBox"></div>
		</div>
		<h2>Chaos from Order</h2>

		<div class="row">
			<label>r:</label>
			<input type="range" id="r" min="0" max="4" value="3.2" step="0.01" style="box-shadow: none;">
		    <span id="r_value">3.2</span>
		    
		</div>
		<div class="row">
			<label>X:</label>
			<input type="range" id="x" min="0" max="1" value="0.7" step="0.01" style="box-shadow: none;">
		    <span id="x_value">0.7</span>
		</div>
		<div class="row">
		    <label>Iterations:</label>
		    <input type="range" id="iterations" min="100" max="1000" value="500" step="10" style="box-shadow: none;">
		    <span id="iterations_value">500</span>
		</div>
		<button id="calculate">Visualize</button>
	</div>
	<div class="graph">
		<canvas id="myChart"></canvas>
	</div>

	<div class="graph">
	    <canvas id="bifurcationChart"></canvas>
	</div>

	<button id="steps">Show Steps</button>
	<p id="ansSteps"></p>

	<script>

		let r = document.getElementById("r");
		let x = document.getElementById("x");
		let submit = document.getElementById("calculate");
		let iterations = document.getElementById("iterations");
		let iterations_value = document.getElementById("iterations_value");
		let bifurcation_chart = null;
		let steps = document.getElementById("steps");
		let ansSteps = document.getElementById("ansSteps");
		const info = document.getElementById("info");
		const infoBox = document.getElementById('infoBox');
		let hoverTimer;
		let steps_html;
		const desc =  `
			        <h3>Logistic Map</h3>
					<h4>
					    A mathematical model that demonstrates how simple nonlinear rules can produce stable, periodic, or chaotic behavior.
					</h4>
					<ul>
					    <li>
					        <b>Growth Rate (r)</b> → Controls the behavior of the system. Small values lead to stability, while larger values can produce oscillations and chaos.
					    </li>
					    <li>
					        <b>Initial Value (x)</b> → The starting value of the sequence, typically chosen between 0 and 1.
					    </li>
					    <li>
					        <b>Iterations</b> → The number of times the logistic equation is repeatedly applied. More iterations reveal the long-term behavior of the system.
					    </li>
					    <li>
					        <b>Equation</b> → Each new value is computed using <b>xₙ₊₁ = r·xₙ(1 − xₙ)</b>.
					    </li>
					    <li>
					        <b>Behavior</b> → Depending on <b>r</b>, the sequence may converge to a fixed value, alternate between values, or exhibit chaotic and unpredictable patterns.
					    </li>
					</ul>
			    `;

		function showInfo(){
			infoBox.innerHTML = desc;
			infoBox.classList.add("show");
		}
		function hideInfo(){
			infoBox.innerHTML = "";
			infoBox.classList.remove("show");

		}

		info.addEventListener("mouseenter",()=>{

			hoverTimer = setTimeout(()=>{
				showInfo();
			},1000);
		});

		info.addEventListener("mouseleave",()=>{

			clearTimeout(hoverTimer);
		});

		info.addEventListener("click",(e)=>{

			e.stopPropagation();

			if(infoBox.classList.contains("show")){
				hideInfo();
			}else{
				showInfo();
			}
		});

		infoBox.addEventListener("mouseenter", () => {
		    clearTimeout(hoverTimer);
		});

		infoBox.addEventListener("mouseleave", () => {
		    hideInfo();
		});

		document.addEventListener("click", () => {
		    hideInfo();
		});

		iterations.addEventListener("input", () => {
		    iterations_value.textContent = iterations.value;
		});
		r.addEventListener("input", () => {
		    r_value.textContent = r.value;
		});
		x.addEventListener("input", () => {
		    x_value.textContent = x.value;
		});
		let my_chart = null;

		submit.addEventListener("click",()=>{

			if(my_chart){
				my_chart.destroy();
			}

			let r_value = parseFloat(r.value);
			let x_value = parseFloat(x.value);
			let iteration_count = parseInt(iterations.value);

			if(isNaN(r_value) || isNaN(x_value))
			{
			    alert("Enter valid values");
			    return;
			}

			let labels = [];
			let data = [];

			for(let i = 0; i < iteration_count; i++)
			{
			    labels.push(i);
			    data.push(x_value);

			    x_value = r_value * x_value * (1 - x_value);
			}

			my_chart = new Chart(document.getElementById("myChart"), {

			    type: "line",

			    data: {

			        labels: labels,

			        datasets: [{
			            label: "x",
			            data: data,
			            pointRadius: 0,
			            borderWidth: 2,
			            tension: 0
			        }]
			    },

			    options: {

			        responsive: true,

			        animation: false,

			        scales: {

			            x: {
			                title: {
			                    display: true,
			                    text: "Iteration"
			                }
			            },

			            y: {
			                min: 0,
			                max: 1,
			                title: {
			                    display: true,
			                    text: "x"
			                }
			            }
			        }
			    }
			});


			if(bifurcation_chart){
			    bifurcation_chart.destroy();
			}

			bifurcation_chart = new Chart(
    document.getElementById("bifurcationChart"),
    {
        type: "scatter",

        data: {
            datasets: [{
                label: "Bifurcation Diagram",
                data: bifurData,
                pointRadius: 0.5,
                showLine: false
            }]
        },

        options: {

            responsive: true,

            animation: false,

            parsing: false,

            plugins: {
                legend: {
                    display: false
                }
            },

            scales: {

                x: {
                    min: 0,
                    max: 4,
                    title: {
                        display: true,
                        text: "r"
                    }
                },

                y: {
                    min: 0,
                    max: 1,
                    title: {
                        display: true,
                        text: "x"
                    }
                }
            }
        }
    }
);

			steps.style.display = 'block';
			steps_html = `
				<div class="steps-container">

					<h2>Logistic Map Iteration</h2>

					<p>
						The logistic map generates a sequence using a simple nonlinear recurrence relation.
					</p>

					<h3>Step 1: Logistic Map Formula</h3>

					<p>
						\\[
						x_{n+1}
						=
						rx_n(1-x_n)
						\\]
					</p>

					<p>
						where:
					</p>

					<ul>
						<li>\\(r\\) = growth rate parameter</li>
						<li>\\(x_0\\) = initial value</li>
						<li>\\(x_n\\) = value after \\(n\\) iterations</li>
					</ul>

					<h3>Step 2: Initial Conditions</h3>

					<p>
						\\[
						r = ${r_value}
						\\]
					</p>

					<p>
						\\[
						x_0 = ${parseFloat(x.value)}
						\\]
					</p>

					<p>
						\\[
						\\text{Iterations} = ${iteration_count}
						\\]
					</p>

					<h3>Step 3: Repeated Iteration</h3>

					<p>
						The formula is applied repeatedly:
					</p>

					<p>
						\\[
						x_1 = r x_0 (1-x_0)
						\\]
					</p>

					<p>
						\\[
						x_2 = r x_1 (1-x_1)
						\\]
					</p>

					<p>
						\\[
						x_3 = r x_2 (1-x_2)
						\\]
					</p>

					<p>
						\\[
						\\vdots
						\\]
					</p>

					<p>
						continuing for ${iteration_count} iterations.
					</p>

					<h3>Step 4: Time Series Plot</h3>

					<p>
						The first graph displays the value of \\(x_n\\) at each iteration,
						showing whether the sequence converges, oscillates, or becomes chaotic.
					</p>

					<h3>Step 5: Bifurcation Diagram</h3>

					<p>
						The bifurcation diagram is generated by repeating the logistic map
						for thousands of values of \\(r\\) between 0 and 4.
					</p>

					<p>
						After discarding transient values, the long-term behavior is plotted.
					</p>

					<p>
						This reveals regions of stability, periodic cycles, period-doubling,
						and chaos.
					</p>

				</div>
				`;

			

		});

		steps.addEventListener("click",()=>{

			if(steps.textContent == "Show Steps"){ 

				ansSteps.innerHTML = steps_html;
				MathJax.typesetPromise();
				steps.textContent = "Hide Steps";
			}else if(steps.textContent == "Hide Steps"){
				ansSteps.innerHTML = ' ';
				steps.textContent = "Show Steps";
			}
		});


	</script>
</body>
</html>
