<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Statistics Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
    <script src="../scripts/statscalc.js"></script>
    <script src="../scripts/pdfGenerator.js"></script>
    <script src="../scripts/ui-components.js"></script>
    <script src="../scripts/theme.js"></script>
    <script src="../scripts/history.js"></script>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* Responsive scaling & overflow protection for Step-by-Step container */
        #ansSteps {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 0;
            padding: 0;
        }
        .steps-container {
            width: 100%;
            max-width: 950px;
            margin: 0 auto;
            padding: clamp(15px, 4vw, 60px);
            box-sizing: border-box;
            overflow-x: hidden;
        }
        /* 2. Auto-center scrolling tables in full screen while preventing overflow */
        .deviation-table {
            width: max-content;
            max-width: 100%;
            margin: 1.5em auto 2em auto !important;
            display: block;
            overflow-x: auto;
            white-space: nowrap;
            border-collapse: collapse;
            font-size: clamp(0.7rem, 1.2vw + 0.4rem, 1rem);
        }
        .deviation-table th, .deviation-table td {
            padding: 8px 14px; /* Reset to clean, compact vertical padding */
            text-align: center;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }
        /* 3. CRITICAL FIX: Ensure inline LaTeX inside table headers stays inline with zero margin */
        .deviation-table mjx-container, .deviation-table mjx-assistive-mml {
            display: inline-block !important;
            margin: 0 !important;
            padding: 0 !important;
            width: auto !important;
        }
        /* 4. Auto-center ONLY display/block MathJax formulas in full screen */
        mjx-container[display="true"] {
            width: max-content !important;
            max-width: 100% !important;
            margin: 1.2em auto !important;
            overflow-x: auto !important;
            overflow-y: hidden !important;
            display: block !important;
            text-align: center !important;
        }
        
    </style>
</head>

<body>

    <div class="container">
        
        <div class="head">
            <h1>Correlation Coefficient</h1>
            <i class="fa-regular fa-circle-question" id="info"></i>
            <div id="infoBox"></div>
        </div>
        <h2>The linear relationship between two variables</h2>
        <div class="row">
            <label>Data 1</label>
            <input type="text" name="x" id="x" placeholder="Enter Data" required>
            <div class="button-wrapper">
                <button id="generateData">
                    <i class="fa-solid fa-angles-up"></i>
                </button>
                <div class="dropdown" id="dropdown-generate">
                    <a id="generate">Generate Data</a>
                </div>
            </div>
        </div>
        <div class="row">
            <label>Data 2</label>
            <input type="text" name="y" id="y" placeholder="Enter Data" required>
            <div class="button-wrapper">
                <button id="importCsv">
                    <i class="fa-solid fa-file-arrow-up"></i>
                </button>
                <div class="dropdown" style="bottom:100%" id="dropdown-import">
                    <a id="import">Import CSV</a>
                </div>
            </div>
        </div>
        <div class="row" style="height: 0em;">
            <div class="button-wrapper" style="margin-left: auto;">
                <button id="exportPDF">
                    <i class="fa-solid fa-arrow-up-from-bracket"></i>
                </button>
                <div class="dropdown" style="bottom: 100%;" id="dropdown-export">
                    <a id="export">Export PDF</a>
                </div>
            </div>
        </div>
        <button id="calculate">Calculate</button>
    </div>

    <p style="font-size: 2em" id="answer"></p>

    <div class="graph">
        <canvas id="myChart"></canvas>
    </div>

    <button id="steps">Show Steps</button>
    <p id="ansSteps"></p>

    <script>
        let x = document.getElementById("x");
        let y = document.getElementById("y");
        let submit = document.getElementById("calculate");
        let result = document.getElementById("answer");
        let steps = document.getElementById("steps");
        let ansSteps = document.getElementById("ansSteps");
        let my_Chart = null;
        let steps_html;
        const info = document.getElementById("info");
        const infoBox = document.getElementById('infoBox');
        let hoverTimer;
        const genDataBtn = document.getElementById("generateData");
        const importCsvBtn = document.getElementById("importCsv");
        const exportPdfBtn = document.getElementById("exportPDF");
        const dropdownGenerate = document.getElementById("dropdown-generate");
        const dropdownImport = document.getElementById("dropdown-import");
        const dropdownExport = document.getElementById("dropdown-export");
        const generate = document.getElementById("generate");
        let r_value = null;

        const desc =  `
                    <h3>Pearson's Correlation Coefficient</h3>
                    <h4>Measures the strength and direction of a linear relationship between two datasets</h4>
                    <ul>
                        <li>r = 1 → Perfect positive correlation, meaning if Data 1 increases, Data 2 also increases.  Same for the other way - both decreasing together.</li>
                        <li>r = -1 → Perfect negative correlation, meaning if Data 1 increases, Data 2 decreases, similarly, if Data 1 decreases, Data 2 increases, following an inverse relationship.</li>
                        <li>r = 0 → No meaningful correlation can be formed.</li>
                    </ul>
                `;

        function showInfo(){
            infoBox.innerHTML = desc;
            infoBox.classList.add("show");
        }
        function hideInfo(){
            infoBox.innerHTML = "";
            infoBox.classList.remove("show");
        }

        info.addEventListener("mouseenter",()=>{
            hoverTimer = setTimeout(()=>{
                showInfo();
            },1000);
        });

        info.addEventListener("mouseleave",()=>{
            clearTimeout(hoverTimer);
        });

        info.addEventListener("click",(e)=>{
            e.stopPropagation();
            if(infoBox.classList.contains("show")){
                hideInfo();
            }else{
                showInfo();
            }
        });

        infoBox.addEventListener("mouseenter", () => {
            clearTimeout(hoverTimer);
        });

        infoBox.addEventListener("mouseleave", () => {
            hideInfo();
        });

        document.addEventListener("click", () => {
            hideInfo();
        });

        genDataBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownGenerate.classList.toggle('show');
            dropdownImport.classList.remove('show');
            dropdownExport.classList.remove('show');
        });

        importCsvBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownImport.classList.toggle('show');
            dropdownGenerate.classList.remove('show');
            dropdownExport.classList.remove('show'); 
        });

        exportPdfBtn.addEventListener("click",(e) => {
            e.stopPropagation();
            dropdownExport.classList.toggle('show');
            dropdownImport.classList.remove('show');
            dropdownGenerate.classList.remove('show');
        });

        document.addEventListener('click', () => {
            dropdownGenerate.classList.remove('show');
            dropdownImport.classList.remove('show');
            dropdownExport.classList.remove('show');
        });

        generate.addEventListener("click",() => {
            const data = generateDataset(2,2,"sequential");
            x.value = data[0][0];
            y.value = data[0][1];
        });

        
        document.addEventListener("keydown",(e) => {
            if (e.key === 'Enter' && e.target.tagName !== "TEXTAREA"){
                
                e.preventDefault();

                submit.classList.add('active-pressed');
                setTimeout(()=> {
                    submit.classList.remove('active-pressed');
                });

                setTimeout(()=>{
                    submit.click();
                });
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
    
            UIC.initImport("x", "y");

            restoreHistoryInputs();

            submit.addEventListener("click",()=>{

                ansSteps.innerHTML = ' ';

                if (my_Chart){
                    my_Chart.destroy();
                }

                steps.textContent = "Show Steps";

                let data_x;
                let data_y;
            
                try{
                    if(x.value.trim() === "" || y.value.trim() === ""){
                        throw "Please enter some data.";
                    }

                    data_x = x.value.trim().split(/[\s,]+/).map(Number);
                    data_y = y.value.trim().split(/[\s,]+/).map(Number);

                    if(data_x.some(Number.isNaN) || data_y.some(Number.isNaN)){
                        throw "Only numerical values are allowed.";
                    }

                    if(data_x.length !== data_y.length){
                        throw "Both datasets must contain the same number of values.";
                    }
                }catch(error){
                    alert(error);
                    return;
                }

                let answers = correlation_coeff(data_x,data_y);

                let r = answers[0];
                r_value = r;
                let sum_x = answers[1];
                let sum_y = answers[2];
                let sum_xx = answers[3];
                let sum_yy = answers[4];
                let sum_xy = answers[5];
                let n = answers[6];
                let xx = answers[7];
                let yy = answers[8];
                let xy = answers[9];

                result.textContent = 'r = ' + r;

                saveHistory(
                    "Correlation",
                    "src/pages/correlation.html",
                    {
                        x:data_x,y:data_y
                    },
                    {
                        r: r
                    }
                    );

                let data_xy = data_x.map((x,i)=>({x: x,y: data_y[i]}));

                my_Chart = new Chart("myChart",{
                    type: "scatter",
                    data: {
                        datasets: [{
                            label: "X vs Y",
                            pointRadius: 4,
                            pointBackgroundColor: "blue",
                            data: data_xy,
                        }]
                    },
                    options: {
                        devicePixelRatio: 4,
                        responsive: true
                    }
                });

                steps.style.display = 'block';
                if(data_x.length > 10){
                    let trimmed_x = data_x.slice(0,9);
                    let trimmed_y = data_y.slice(0,9);
                    let trimmed_xx = xx.slice(0,9);
                    let trimmed_yy = yy.slice(0,9);
                    let trimmed_xy = xy.slice(0,9);
                    steps_html = `
                        <div class="steps-container">

                            <h2>Pearson's Correlation Coefficient</h2>

                            <p>
                                The Pearson correlation coefficient measures the strength
                                and direction of the linear relationship between two variables.
                            </p>

                            <h3>Formula</h3>

                            <p>
                                \\[
                                r =
                                \\frac{
                                n\\sum xy - (\\sum x)(\\sum y)
                                }
                                {
                                \\sqrt{
                                [n\\sum x^2 - (\\sum x)^2]
                                [n\\sum y^2 - (\\sum y)^2]
                                }
                                }
                                \\]
                            </p>

                            <h3>Step 1: Compute the Required Constants</h3>

                            <table class="deviation-table">

                                <tr>
                                    <th>\\(x\\)</th>
                                    <th>\\(y\\)</th>
                                    <th>\\(x^2\\)</th>
                                    <th>\\(y^2\\)</th>
                                    <th>\\(xy\\)</th>
                                </tr>


                                ${trimmed_x.map((xVal,i)=>{

                                    return `
                                        <tr>
                                            <td>${xVal}</td>
                                            <td>${trimmed_y[i]}</td>
                                            <td>${trimmed_xx[i]}</td>
                                            <td>${trimmed_yy[i]}</td>
                                            <td>${trimmed_xy[i]}</td>
                                        </tr>
                                    `;

                                }).join('')}

                                <tr>
                                    <td>...</td>
                                    <td>...</td>
                                    <td>...</td>
                                    <td>...</td>
                                    <td>...</td>
                                </tr>

                                <tr>
                                    <td>${data_x[data_x.length - 1]}</td>
                                    <td>${data_y[data_y.length - 1]}</td>
                                    <td>${xx[xx.length - 1]}</td>
                                    <td>${yy[yy.length - 1]}</td>
                                    <td>${xy[xy.length - 1]}</td>
                                </tr>

                                <tr class="sum-row">
                                    <td><b>${sum_x}</b></td>
                                    <td><b>${sum_y}</b></td>
                                    <td><b>${sum_xx}</b></td>
                                    <td><b>${sum_yy}</b></td>
                                    <td><b>${sum_xy}</b></td>
                                </tr>

                            </table>

                            <p>
                                \\[
                                n = ${n}
                                \\]
                            </p>

                            <p>
                                \\[
                                \\sum x = ${sum_x}
                                \\]
                            </p>

                            <p>
                                \\[
                                \\sum y = ${sum_y}
                                \\]
                            </p>

                            <p>
                                \\[
                                \\sum x^2 = ${sum_xx}
                                \\]
                            </p>

                            <p>
                                \\[
                                \\sum y^2 = ${sum_yy}
                                \\]
                            </p>

                            <p>
                                \\[
                                \\sum xy = ${sum_xy}
                                \\]
                            </p>

                            <h3>Step 2: Substitute into the Formula</h3>

                            <p>
                                \\[
                                r =
                                \\frac{
                                (${n})(${sum_xy}) - (${sum_x})(${sum_y})
                                }
                                {
                                \\sqrt{
                                [
                                (${n})(${sum_xx}) - (${sum_x})^2
                                ]
                                [
                                (${n})(${sum_yy}) - (${sum_y})^2
                                ]
                                }
                                }
                                \\]
                            </p>

                            <p>
                                \\[
                                r = ${r}
                                \\]
                            </p>


                            <h3>Final Answer</h3>

                            <p style="font-size:1.5em; font-weight:bold;">
                                \\[
                                r = ${r}
                                \\]
                            </p>

                        </div>
                    `;

                }else{ 
                    steps_html = `
                        <div class="steps-container">

                            <h2>Pearson's Correlation Coefficient</h2>

                            <p>
                                The Pearson correlation coefficient measures the strength
                                and direction of the linear relationship between two variables.
                            </p>

                            <h3>Formula</h3>

                            <p>
                                \\[
                                r =
                                \\frac{
                                n\\sum xy - (\\sum x)(\\sum y)
                                }
                                {
                                \\sqrt{
                                [n\\sum x^2 - (\\sum x)^2]
                                [n\\sum y^2 - (\\sum y)^2]
                                }
                                }
                                \\]
                            </p>

                            <h3>Step 1: Compute the Required Constants</h3>

                            <table class="deviation-table">

                                <tr>
                                    <th>\\(x\\)</th>
                                    <th>\\(y\\)</th>
                                    <th>\\(x^2\\)</th>
                                    <th>\\(y^2\\)</th>
                                    <th>\\(xy\\)</th>
                                </tr>


                                ${data_x.map((xVal,i)=>{

                                    return `
                                        <tr>
                                            <td>${xVal}</td>
                                            <td>${data_y[i]}</td>
                                            <td>${xx[i]}</td>
                                            <td>${yy[i]}</td>
                                            <td>${xy[i]}</td>
                                        </tr>
                                    `;

                                }).join('')}

                                <tr class="sum-row">
                                    <td><b>${sum_x}</b></td>
                                    <td><b>${sum_y}</b></td>
                                    <td><b>${sum_xx}</b></td>
                                    <td><b>${sum_yy}</b></td>
                                    <td><b>${sum_xy}</b></td>
                                </tr>

                            </table>

                            <p>
                                \\[
                                n = ${n}
                                \\]
                            </p>

                            <p>
                                \\[
                                \\sum x = ${sum_x}
                                \\]
                            </p>

                            <p>
                                \\[
                                \\sum y = ${sum_y}
                                \\]
                            </p>

                            <p>
                                \\[
                                \\sum x^2 = ${sum_xx}
                                \\]
                            </p>

                            <p>
                                \\[
                                \\sum y^2 = ${sum_yy}
                                \\]
                            </p>

                            <p>
                                \\[
                                \\sum xy = ${sum_xy}
                                \\]
                            </p>

                            <h3>Step 2: Substitute into the Formula</h3>

                            <p>
                                \\[
                                r =
                                \\frac{
                                (${n})(${sum_xy}) - (${sum_x})(${sum_y})
                                }
                                {
                                \\sqrt{
                                [
                                (${n})(${sum_xx}) - (${sum_x})^2
                                ]
                                [
                                (${n})(${sum_yy}) - (${sum_y})^2
                                ]
                                }
                                }
                                \\]
                            </p>

                            <p>
                                \\[
                                r = ${r}
                                \\]
                            </p>


                            <h3>Final Answer</h3>

                            <p style="font-size:1.5em; font-weight:bold;">
                                \\[
                                r = ${r}
                                \\]
                            </p>

                        </div>
                    `;
                }
            });
        });

        steps.addEventListener("click",()=>{
            if(steps.textContent == "Show Steps"){ 
                ansSteps.innerHTML = steps_html;
                MathJax.typesetPromise();
                steps.textContent = "Hide Steps";
            }else if(steps.textContent == "Hide Steps"){
                ansSteps.innerHTML = ' ';
                steps.textContent = "Show Steps";
            }
        });

        document.getElementById("export").addEventListener("click", async () => {
            if (r_value === null) {
                alert("Please run the calculation first!");
                return;
            }

            const exportBtn = document.getElementById("export");
            const originalText = exportBtn.innerText;
            exportBtn.innerText = "Saving PDF...";
            exportBtn.style.pointerEvents = "none";

            const formattedX = formatDataForReport(x.value.trim());
            const formattedY = formatDataForReport(y.value.trim());

            await generateModularPDF({
                title: "Pearson Correlation Coefficient Analysis",
                datasetHTML: `
                    <p style="margin: 0 0 10px 0;"><strong>Data 1 (X):</strong> ${formattedX}</p>
                    <p style="margin: 0;"><strong>Data 2 (Y):</strong> ${formattedY}</p>
                `,
                resultsHTML: `
                    <p style="font-size: 18px; margin-bottom: 15px;">
                        <strong>Pearson Correlation (r):</strong> ${r_value}
                    </p>
                    <div style="font-size: 20px; padding: 18px; background: #f0f7ff; text-align: center; border-radius: 8px; border: 1px solid #cce0ff;">
                        \\[ r = \\frac{n\\sum xy - (\\sum x)(\\sum y)}{\\sqrt{[n\\sum x^2 - (\\sum x)^2][n\\sum y^2 - (\\sum y)^2]}} \\]
                    </div>
                `,
                chartCanvasId: "myChart",
                stepsHTML: steps_html
            });

            exportBtn.innerText = originalText;
            exportBtn.style.pointerEvents = "auto";
        });
    </script>
</body>
</html>
