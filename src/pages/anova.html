<!DOCTYPE html>

<html>

<head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1">

<title>Statistics Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
<script src="https://cdn.jsdelivr.net/npm/@sgratzl/chartjs-chart-boxplot@4.4.1/build/index.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jstat@latest/dist/jstat.min.js"></script>
<script src="../scripts/statscalc.js"></script>
<script src="../scripts/pdfGenerator.js"></script>
<script src="../scripts/ui-components.js"></script>
<script src="../scripts/theme.js"></script>
<script src="../scripts/history.js"></script>

<link rel="stylesheet" type="text/css" href="styles.css">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

    #ansSteps {
        width: 100%;
        display: flex;
        justify-content: center;
        margin: 0;
        padding: 0;
    }

    .steps-container {
        width: 100%;
        max-width: 950px;
        margin: 0 auto;
        padding: clamp(15px, 4vw, 60px);
        box-sizing: border-box;
        overflow-x: hidden;
    }

    mjx-container[display="true"] {
        width: max-content !important;
        max-width: 100% !important;
        margin: 0.1em auto !important;
        overflow-x: auto !important;
        display: block !important;
        text-align: center !important;
        font-size: clamp(0.85em, 1.5vw + 0.4em, 2em) !important;
    }

    .steps-container p {
        max-width: 100%;
        overflow-wrap: break-word;
        word-break: break-word;
    }

    .slider-container {
        width: 75%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-left: 10px;
        margin-bottom: 30px;
    }

    input[type="range"] {
        width: 80%;
        cursor: pointer;
        margin: 0;
        padding: 0;
    }

    #groupDisplay {
        font-size: 1.5em;
        font-weight: bold;
        color: rgb(10,100,255);
        font-family: monospace;
        width: 15%;
        text-align: right;
    }

    .large-equation {
        font-size: 1.2em;
        font-family: monospace;
        text-align: center;
        padding: 20px;
        background: #f0f7ff;
        border-radius: 8px;
        border: 1px solid #cce0ff;
        margin: 20px auto;
        max-width: 90%;
        overflow-x: auto;
        white-space: nowrap;
    }

    .anova-table {
        width: 95%;
        max-width: 850px;
        margin: 25px auto;
        border-collapse: collapse;
        font-family: monospace;
        font-size: 1em;
    }

    .anova-table th,
    .anova-table td {
        padding: 12px 10px;
        border: 1px solid var(--border, #ccc);
        text-align: center;
    }

    .anova-table th {
        font-weight: bold;
    }

    .anova-table td:first-child,
    .anova-table th:first-child {
        text-align: left;
    }

</style>

</head>

<body>

<div class="container" style="height: 500px;">

    <div class="head">
        <h1>One-Way ANOVA</h1>

        <i class="fa-regular fa-circle-question" id="info"></i>

        <div id="infoBox"></div>
    </div>


    <h2>Testing the means of different groups to see what it signifies.</h2>


    <div class="row">

        <label style="margin-right: 20px;">
            Groups:
        </label>

        <input type="range"
               id="groupCount"
               min="2"
               max="10"
               value="2"
               style="box-shadow: 0 0 0; width: 64%;">

        <span id="groupDisplay"
              style="color:var(--text); margin-right: 20px;">
            2
        </span>

    </div>

    <div class="row">

        <label>
            Dataset:
        </label>


        <div class="button-wrapper" style="margin-left: 10px;">

            <button id="importCsv">
                <i class="fa-solid fa-file-arrow-up"></i>
            </button>


            <div class="dropdown"
                 style="bottom:100%;"
                 id="dropdown-import">

                <a id="import">
                    Import CSV
                </a>

            </div>

        </div>


        <input type="file"
               id="csvInput"
               accept=".csv,text/csv"
               style="display:none;">


        <div class="button-wrapper" style="margin-left: auto">

            <button id="exportPDF">
                <i class="fa-solid fa-arrow-up-from-bracket"></i>
            </button>


            <div class="dropdown"
                 style="bottom:100%;"
                 id="dropdown-export">

                <a id="export">
                    Export PDF
                </a>

            </div>

        </div>

    </div>


    <div class="row" style="height:0em;"></div>


    <button id="calculate">
        Calculate
    </button>

</div>

<p id="answer"></p>

<div class="graph">
    <canvas id="myChart"></canvas>
</div>

<button id="steps">
    Show Steps
</button>

<p id="ansSteps"></p>

<script>

    // ============================================================
    // DOM REFERENCES
    // ============================================================

    let groupSlider = document.getElementById("groupCount");
    let groupDisplay = document.getElementById("groupDisplay");

    let importCsvBtn = document.getElementById("importCsv");
    let csvInput = document.getElementById("csvInput");

    let submit = document.getElementById("calculate");
    let result = document.getElementById("answer");

    let steps = document.getElementById("steps");
    let ansSteps = document.getElementById("ansSteps");

    let my_chart = null;
    let steps_html = "";

    const info = document.getElementById("info");
    const infoBox = document.getElementById("infoBox");
    let hoverTimer;

    const exportPdfBtn = document.getElementById("exportPDF");
    const dropdownExport = document.getElementById("dropdown-export");
    const dropdownImport = document.getElementById("dropdown-import");

    let calc_values = null;

    let global_groups = [];
    let data_loaded = false;


    // ============================================================
    // INFORMATION
    // ============================================================

    const desc = `

        <h3>One-Way ANOVA</h3>

        <h4>
            Tests whether the means of multiple independent groups
            are significantly different from one another.
        </h4>

        <ul>

            <li>
                <b>Between-Group Variation</b> →
                Measures how far the group means are from the
                overall grand mean.
            </li>

            <li>
                <b>Within-Group Variation</b> →
                Measures how much the observations vary inside
                their respective groups.
            </li>

            <li>
                <b>F Statistic</b> →
                Ratio of between-group variation to
                within-group variation.
            </li>

            <li>
                <b>p-value</b> →
                Probability of obtaining an F statistic this
                extreme if all group means are equal.
            </li>

            <li>
                <b>Eta Squared (η²)</b> →
                Proportion of total variation explained by
                differences between groups.
            </li>

            <li>
                <b>Data Formatting</b> →
                Import a CSV, then select one column for each
                group in the dialog.
            </li>

        </ul>

    `;


    function showInfo() {

        infoBox.innerHTML = desc;

        infoBox.classList.add("show");

    }


    function hideInfo() {

        infoBox.innerHTML = "";

        infoBox.classList.remove("show");

    }


    info.addEventListener("mouseenter", () => {

        hoverTimer = setTimeout(() => {

            showInfo();

        }, 1000);

    });


    info.addEventListener("mouseleave", () => {

        clearTimeout(hoverTimer);

    });


    info.addEventListener("click", (e) => {

        e.stopPropagation();

        if (infoBox.classList.contains("show")) {

            hideInfo();

        } else {

            showInfo();

        }

    });


    infoBox.addEventListener("mouseenter", () => {

        clearTimeout(hoverTimer);

    });


    infoBox.addEventListener("mouseleave", () => {

        hideInfo();

    });


    document.addEventListener("click", () => {

        hideInfo();

    });


    // ============================================================
    // DROPDOWN HANDLING
    // ============================================================

    importCsvBtn.addEventListener("click", (e) => {

        e.stopPropagation();

        dropdownImport.classList.toggle("show");

        dropdownExport.classList.remove("show");

    });


    exportPdfBtn.addEventListener("click", (e) => {

        e.stopPropagation();

        dropdownExport.classList.toggle("show");

        dropdownImport.classList.remove("show");

    });


    document.addEventListener("click", () => {

        dropdownImport.classList.remove("show");

        dropdownExport.classList.remove("show");

    });


    // ============================================================
    // GROUP SLIDER
    // ============================================================

    groupSlider.addEventListener("input", function () {

        groupDisplay.innerText = this.value;

        data_loaded = false;

        global_groups = [];

        calc_values = null;

    });


    // ============================================================
    // CSV IMPORT
    // ============================================================

    document.getElementById("import").addEventListener(
        "click",
        (e) => {

            e.preventDefault();
            e.stopPropagation();

            dropdownImport.classList.remove("show");

            csvInput.click();

        }
    );


    csvInput.addEventListener("change", (e) => {

        const file = e.target.files[0];

        if (!file) return;


        const reader = new FileReader();


        reader.onload = function (ev) {

            try {

                const csvText = ev.target.result;

                const parsed = StatsCalc.parseCSV(csvText);


                if (parsed.rowCount === 0) {

                    alert(
                        "No valid numeric data found in the CSV file."
                    );

                    csvInput.value = "";

                    return;

                }


                const numGroups =
                    parseInt(groupSlider.value, 10);


                if (parsed.columnCount < numGroups) {

                    throw new Error(

                        `CSV has only ${parsed.columnCount} column(s). ` +
                        `Need at least ${numGroups} columns for ` +
                        `${numGroups} group(s).`

                    );

                }

                UIC.showColumnSelector(

                    parsed,

                    Array.from(
                        { length: numGroups },
                        (_, i) => `Group ${i + 1}`
                    ),

                    (selectedCols) => {

                        try {

                            if (
                                selectedCols.length !== numGroups
                            ) {

                                throw new Error(
                                    `You must select exactly ` +
                                    `${numGroups} group columns.`
                                );

                            }

                            const used =
                                new Set(selectedCols);


                            if (
                                used.size !== numGroups
                            ) {

                                throw new Error(
                                    "Each group must use a different " +
                                    "CSV column."
                                );

                            }

                            const finalResult =
                                StatsCalc.parseCSV(
                                    csvText,
                                    { cols: selectedCols }
                                );


                            if (
                                !finalResult.columns ||
                                finalResult.columns.length !== numGroups
                            ) {

                                throw new Error(
                                    "Unable to import the selected columns."
                                );

                            }

                            const importedGroups =
                                Array.from(
                                    { length: numGroups },
                                    (_, i) =>
                                        (
                                            finalResult.columns[i] || []
                                        ).filter(Number.isFinite)
                                );

                            importedGroups.forEach(
                                (group, i) => {

                                    if (group.length < 2) {

                                        throw new Error(

                                            `Group ${i + 1} must contain ` +
                                            `at least 2 valid numeric ` +
                                            `readings.`

                                        );

                                    }

                                }
                            );
                            global_groups =
                                importedGroups;

                            data_loaded = true;

                            calc_values = null;
                            const totalReadings =
                                global_groups.reduce(
                                    (sum, group) =>
                                        sum + group.length,
                                    0
                                );


                            StatsCalc.showToast(

                                `Imported ${totalReadings} readings across ` +
                                `${numGroups} groups`

                            );


                        } catch (error) {

                            alert(
                                error.message || error
                            );

                        }

                    }

                );


            } catch (error) {

                alert(
                    "Error parsing CSV: " +
                    (error.message || error)
                );

                data_loaded = false;

                global_groups = [];

            }
            csvInput.value = "";

        };


        reader.readAsText(file);

    });

    document.addEventListener("keydown", (e) => {

        if (
            e.key === "Enter" &&
            e.target.tagName !== "TEXTAREA" &&
            e.target.tagName !== "SELECT"
        ) {

            e.preventDefault();


            submit.classList.add("active-pressed");


            setTimeout(() => {

                submit.classList.remove("active-pressed");

            }, 150);


            setTimeout(() => {

                submit.click();

            }, 20);

        }

    });


    // ============================================================
    // CALCULATION
    // ============================================================

    submit.addEventListener("click", () => {

        ansSteps.innerHTML = " ";

        steps.textContent = "Show Steps";


        if (my_chart) {

            my_chart.destroy();

            my_chart = null;

        }


        try {

            // --------------------------------------------------------
            // Validate imported data
            // --------------------------------------------------------

            if (
                !data_loaded ||
                global_groups.length === 0
            ) {

                throw new Error(
                    "Please import a CSV dataset first."
                );

            }


            const numGroups =
                parseInt(groupSlider.value, 10);


            if (
                global_groups.length !== numGroups
            ) {

                throw new Error(

                    `Loaded data has ${global_groups.length} group(s) ` +
                    `but the Groups slider is set to ${numGroups}. ` +
                    `Re-import the CSV after adjusting the slider.`

                );

            }


            // --------------------------------------------------------
            // Run ANOVA
            // --------------------------------------------------------

            let res = one_way_anova(global_groups);


            // --------------------------------------------------------
            // Round values for display
            // --------------------------------------------------------

            const groupMeans =
                res.group_means.map(
                    value => parseFloat(value.toFixed(5))
                );


            const grandMean =
                parseFloat(
                    res.grand_mean.toFixed(5)
                );


            const ssBetween =
                parseFloat(
                    res.ss_between.toFixed(5)
                );


            const ssWithin =
                parseFloat(
                    res.ss_within.toFixed(5)
                );


            const ssTotal =
                parseFloat(
                    res.ss_total.toFixed(5)
                );


            const msBetween =
                parseFloat(
                    res.ms_between.toFixed(5)
                );


            const msWithin =
                parseFloat(
                    res.ms_within.toFixed(5)
                );


            const F =
                res.F === Infinity
                    ? Infinity
                    : parseFloat(res.F.toFixed(5));


            const pValue =
                parseFloat(
                    res.p_value.toFixed(6)
                );


            const etaSquared =
                parseFloat(
                    res.eta_squared.toFixed(5)
                );


            // --------------------------------------------------------
            // Store calculation values
            // --------------------------------------------------------

            calc_values = {

                groups: numGroups,

                groupSizes: res.group_sizes,

                groupMeans: groupMeans,

                grandMean: grandMean,

                ssBetween: ssBetween,

                ssWithin: ssWithin,

                ssTotal: ssTotal,

                dfBetween: res.df_between,

                dfWithin: res.df_within,

                dfTotal: res.df_total,

                msBetween: msBetween,

                msWithin: msWithin,

                F: F,

                pValue: pValue,

                etaSquared: etaSquared,

                n: res.total_n

            };


            // --------------------------------------------------------
            // Save history
            // --------------------------------------------------------

            saveHistory(

                "One-Way ANOVA",

                "src/pages/anova.html",

                {
                    groupCount: numGroups
                },

                calc_values

            );


            // --------------------------------------------------------
            // Result
            // --------------------------------------------------------

            result.style.display = "block";


            const fDisplay =
                F === Infinity
                    ? "\\infty"
                    : F;


            result.innerHTML = `

                <div style="
                    font-size:1.25em;
                    text-align:center;
                    width:100%;
                ">

                    <div style="
                        font-family:monospace;
                        margin-bottom:10px;
                        font-size:1.5em;
                    ">

                        \\[
                            F = ${fDisplay}
                        \\]

                    </div>


                    <div style="
                        font-family:monospace;
                        margin-bottom:20px;
                        font-size: 1.5em;
                    ">

                        \\[
                            p = ${pValue}
                        \\]

                    </div>


                    <table class="anova-table">

                        <thead>

                            <tr>
                                <th>Source</th>
                                <th>SS</th>
                                <th>df</th>
                                <th>MS</th>
                                <th>F</th>
                            </tr>

                        </thead>

                        <tbody>

                            <tr>

                                <td>
                                    Between Groups
                                </td>

                                <td>
                                    ${ssBetween}
                                </td>

                                <td>
                                    ${res.df_between}
                                </td>

                                <td>
                                    ${msBetween}
                                </td>

                                <td>
                                    ${calc_values.F}
                                </td>

                            </tr>


                            <tr>

                                <td>
                                    Within Groups
                                </td>

                                <td>
                                    ${ssWithin}
                                </td>

                                <td>
                                    ${res.df_within}
                                </td>

                                <td>
                                    ${msWithin}
                                </td>

                                <td>
                                    —
                                </td>

                            </tr>


                            <tr>

                                <td>
                                    Total
                                </td>

                                <td>
                                    ${ssTotal}
                                </td>

                                <td>
                                    ${res.df_total}
                                </td>

                                <td>
                                    —
                                </td>

                                <td>
                                    —
                                </td>

                            </tr>

                        </tbody>

                    </table>


                    <div style="
                        font-family:monospace;
                        margin-top:20px;
                        font-size: 1.5em;
                    ">

                        \\[
                            \\eta^2 = ${etaSquared}
                        \\]

                    </div>

                </div>

            `;


            MathJax.typesetPromise();

let boxplotData = [];
let rawData = [];
let meanData = [];

let allValues = [];

global_groups.forEach((group, i) => {

    let sorted = [...group].sort((a, b) => a - b);

    let values = quartile(group);

    let q1 = values[0];
    let median = values[1];
    let q3 = values[2];

    let min = Math.min(...sorted);
    let max = Math.max(...sorted);

    allValues.push(...group);

    // --------------------------------------------------------
    // Box
    // --------------------------------------------------------

    boxplotData.push({
        x: i,

        min: min,
        q1: q1,
        median: median,
        q3: q3,
        max: max,

        whiskerMin: min,
        whiskerMax: max
    });

    // --------------------------------------------------------
    // Individual values
    // --------------------------------------------------------

    group.forEach((value,j) => {

        rawData.push({
            x: i + (Math.random() - 0.5)*0.2,
            y: value
        });
    });

    // --------------------------------------------------------
    // Mean
    // --------------------------------------------------------

    let mean =
        group.reduce((sum, value) => sum + value, 0)
        / group.length;

    meanData.push({
        x: i,
        y: mean
    });
});


// ============================================================
// Calculate a sensible Y-axis range
// ============================================================

let dataMin = Math.min(...allValues);
let dataMax = Math.max(...allValues);

let dataRange = dataMax - dataMin;

// Handle identical values
if (dataRange === 0) {
    dataRange = Math.abs(dataMax) * 0.1;

    if (dataRange === 0) {
        dataRange = 1;
    }
}

// ------------------------------------------------------------
// Choose a "nice" tick size
// ------------------------------------------------------------

function niceStep(range) {

    let roughStep = range / 6;

    let magnitude =
        Math.pow(10, Math.floor(Math.log10(roughStep)));

    let normalized = roughStep / magnitude;

    let nice;

    if (normalized <= 1) {
        nice = 1;
    }
    else if (normalized <= 2) {
        nice = 2;
    }
    else if (normalized <= 5) {
        nice = 5;
    }
    else {
        nice = 10;
    }

    return nice * magnitude;
}

let yStep = niceStep(dataRange);

// Give the graph one tick of breathing room
let yMin =
    Math.floor(dataMin / yStep) * yStep - yStep;

let yMax =
    Math.ceil(dataMax / yStep) * yStep + yStep;


// ============================================================
// Create chart
// ============================================================

my_chart = new Chart("myChart", {

    type: "scatter",

    data: {

        datasets: [

            // =================================================
            // Box plots
            // =================================================

            {
                type: "boxplot",

                label: "Group Distribution",

                data: boxplotData,

                backgroundColor: "rgba(10,100,255,0.20)",
                borderColor: "rgb(10,100,255)",

                borderWidth: 2,

                // Similar visual size to your quartiles chart
                barThickness: 50
            },

            // =================================================
            // Individual observations
            // =================================================

            {
                type: "scatter",

                label: "Raw Data",

                data: rawData,

                pointRadius: 3,
                pointHoverRadius: 6,

                backgroundColor: "green"
            },

            // =================================================
            // Group means
            // =================================================

            {
                type: "scatter",

                label: "Mean",

                data: meanData,

                pointStyle: "rectRot",

                pointRadius: 6,
                pointHoverRadius: 7,

                backgroundColor: "white",
                borderColor: "rgb(10,100,255)",

                borderWidth: 2
            }
        ]
    },

    options: {

        responsive: true,

        devicePixelRatio: 4,

        layout: {
            padding: 20
        },

        plugins: {

            legend: {
                display: false
            },

            title: {

                display: true,

                text: "One-Way ANOVA"
            },

            tooltip: {

                callbacks: {

                    label: function(context) {

                        let v = context.raw;

                        // ------------------------------------------------
                        // Individual value
                        // ------------------------------------------------

                        if (
                            context.dataset.label === "Raw Data"
                        ) {
                            return `Value: ${v.y.toFixed(5)}`;
                        }

                        // ------------------------------------------------
                        // Mean
                        // ------------------------------------------------

                        if (
                            context.dataset.label === "Mean"
                        ) {
                            return `Mean: ${v.y.toFixed(5)}`;
                        }

                        // ------------------------------------------------
                        // Boxplot
                        // ------------------------------------------------

                        return [
                            `Min: ${v.min.toFixed(5)}`,
                            `Q1: ${v.q1.toFixed(5)}`,
                            `Median: ${v.median.toFixed(5)}`,
                            `Q3: ${v.q3.toFixed(5)}`,
                            `Max: ${v.max.toFixed(5)}`,
                            `IQR: ${(v.q3 - v.q1).toFixed(5)}`
                        ];
                    }
                }
            }
        },

        scales: {

            // ========================================================
            // X AXIS
            // ========================================================

            x: {

                type: "linear",

                min: -0.5,

                max: global_groups.length - 0.5,

                afterBuildTicks: function(scale) {

                    // Create EXACTLY one tick for each group
                    scale.ticks = global_groups.map(
                        (_, i) => ({
                            value: i
                        })
                    );
                },

                ticks: {

                    callback: function(value) {

                        let index = Number(value);

                        if (
                            Number.isInteger(index) &&
                            index >= 0 &&
                            index < global_groups.length
                        ) {
                            return `Group ${index + 1}`;
                        }

                        return "";
                    },

                    autoSkip: false
                },

                title: {

                    display: true,

                    text: "Groups"
                },

                grid: {

                    display: false
                }
            },

            // ========================================================
            // Y AXIS
            // ========================================================

            y: {

                min: yMin,

                max: yMax,

                ticks: {

                    stepSize: yStep
                },

                title: {

                    display: true,

                    text: "Values"
                },

                grid: {

                    display: false
                }
            }
        }
    }
});

            // ========================================================
            // STEPS
            // ========================================================

            const groupMeanHTML =
                groupMeans
                    .map(
                        (value, i) =>
                            `\\(\\bar{x}_${i + 1} = ${value}\\)`
                    )
                    .join("<br>");


            const groupSizeHTML =
                res.group_sizes
                    .map(
                        (value, i) =>
                            `\\(n_${i + 1} = ${value}\\)`
                    )
                    .join("<br>");


            steps_html = `

                <div class="steps-container">


                    <h2>
                        One-Way ANOVA Calculation
                    </h2>


                    <p>
                        One-Way ANOVA determines whether the means
                        of multiple groups differ significantly by
                        comparing variation between groups with
                        variation within groups.
                    </p>


                    <h3>
                        Step 1: Group Means
                    </h3>


                    <p>
                        The mean of each group is calculated as:
                    </p>


                    <p>

                        \\[
                            \\bar{x}_i =
                            \\frac{\\sum x_i}{n_i}
                        \\]

                    </p>


                    <p style="font-size:0.9em">

                        ${groupMeanHTML}

                    </p>


                    <h3>
                        Step 2: Grand Mean
                    </h3>


                    <p>
                        The grand mean is the mean of all observations
                        across all groups:
                    </p>


                    <p>

                        \\[
                            \\bar{x} =
                            \\frac{\\sum x}{N}
                            =
                            ${grandMean}
                        \\]

                    </p>


                    <h3>
                        Step 3: Between-Group Sum of Squares
                    </h3>


                    <p>
                        Between-group variation measures how far each
                        group mean is from the grand mean:
                    </p>


                    <p>

                        \\[
                            SS_B =
                            \\sum_{i=1}^{k}
                            n_i
                            (\\bar{x}_i - \\bar{x})^2
                            =
                            ${ssBetween}
                        \\]

                    </p>


                    <h3>
                        Step 4: Within-Group Sum of Squares
                    </h3>


                    <p>
                        Within-group variation measures how far each
                        observation is from its own group mean:
                    </p>


                    <p>

                        \\[
                            SS_W =
                            \\sum_{i=1}^{k}
                            \\sum_{j=1}^{n_i}
                            (x_{ij}-\\bar{x}_i)^2
                            =
                            ${ssWithin}
                        \\]

                    </p>


                    <h3>
                        Step 5: Total Sum of Squares
                    </h3>


                    <p>

                        \\[
                            SS_T =
                            SS_B + SS_W
                            =
                            ${ssTotal}
                        \\]

                    </p>


                    <h3>
                        Step 6: Degrees of Freedom
                    </h3>


                    <p>

                        \\[
                            df_B = k - 1
                            =
                            ${res.df_between}
                        \\]

                    </p>


                    <p>

                        \\[
                            df_W = N - k
                            =
                            ${res.df_within}
                        \\]

                    </p>


                    <p>

                        \\[
                            df_T = N - 1
                            =
                            ${res.df_total}
                        \\]

                    </p>


                    <h3>
                        Step 7: Mean Squares
                    </h3>


                    <p>

                        \\[
                            MS_B =
                            \\frac{SS_B}{df_B}
                            =
                            ${msBetween}
                        \\]

                    </p>


                    <p>

                        \\[
                            MS_W =
                            \\frac{SS_W}{df_W}
                            =
                            ${msWithin}
                        \\]

                    </p>


                    <h3>
                        Step 8: F Statistic
                    </h3>


                    <p>
                        The ANOVA F statistic is the ratio of
                        between-group variance to within-group variance:
                    </p>


                    <p>

                        \\[
                            F =
                            \\frac{MS_B}{MS_W}
                            =
                            ${fDisplay}
                        \\]

                    </p>


                    <h3>
                        Step 9: p-value
                    </h3>


                    <p>

                        The p-value is obtained from the F distribution
                        using ${res.df_between} and ${res.df_within}
                        degrees of freedom:

                    </p>


                    <p>

                        \\[
                            p = ${pValue}
                        \\]

                    </p>


                    <h3>
                        Step 10: Effect Size
                    </h3>


                    <p>
                        Eta squared represents the proportion of total
                        variation explained by differences between groups:
                    </p>


                    <p>

                        \\[
                            \\eta^2 =
                            \\frac{SS_B}{SS_T}
                            =
                            ${etaSquared}
                        \\]

                    </p>


                    <h3>
                        ANOVA Summary
                    </h3>


                    <table class="anova-table">

                        <thead>

                            <tr>

                                <th>
                                    Source
                                </th>

                                <th>
                                    SS
                                </th>

                                <th>
                                    df
                                </th>

                                <th>
                                    MS
                                </th>

                                <th>
                                    F
                                </th>

                            </tr>

                        </thead>


                        <tbody>

                            <tr>

                                <td>
                                    Between Groups
                                </td>

                                <td>
                                    ${ssBetween}
                                </td>

                                <td>
                                    ${res.df_between}
                                </td>

                                <td>
                                    ${msBetween}
                                </td>

                                <td>
                                    ${fDisplay}
                                </td>

                            </tr>


                            <tr>

                                <td>
                                    Within Groups
                                </td>

                                <td>
                                    ${ssWithin}
                                </td>

                                <td>
                                    ${res.df_within}
                                </td>

                                <td>
                                    ${msWithin}
                                </td>

                                <td>
                                    —
                                </td>

                            </tr>


                            <tr>

                                <td>
                                    Total
                                </td>

                                <td>
                                    ${ssTotal}
                                </td>

                                <td>
                                    ${res.df_total}
                                </td>

                                <td>
                                    —
                                </td>

                                <td>
                                    —
                                </td>

                            </tr>

                        </tbody>

                    </table>


                </div>

            `;


            steps.style.display = "block";


        } catch (error) {

            alert(
                error.message || error
            );

        }

    });
