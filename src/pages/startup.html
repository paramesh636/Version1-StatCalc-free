<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Startup</title>
</head>
<style>
body{
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: monospace;
}
h1{
    font-size: min(5vw, 3rem);
}
h2{
    font-size: min(3vw, 2rem);
}

.ball,
.ball1,
.ball2 {
    width: min(3vw, 30px);
    background: black;

    transform-origin: bottom;
    transform: scaleY(0);
    animation: grow-up 0.5s ease-out forwards;
}

@keyframes grow-up {
    to {
        transform: scaleY(1);
    }
}

.logo{
    display:flex;
    align-items:flex-end;
    gap:1rem;
    margin-bottom:2rem;
}

.ball  {
    height:min(15vh,150px);
    animation-delay:0.1s;
}

.ball1 {
    height:min(10vh,100px);
    animation-delay:0.2s;
}

.ball2 {
    height:min(8vh,80px);
    animation-delay:0.3s;
}

</style>
<body>
<div class="logo">
    <div class="ball"></div>
    <div class="ball1"></div>
    <div class="ball2"></div>
</div>
<h1>Welcome</h1>
<h2>Start Calculating. Visualize everything. </h2>
</body>
</html>
