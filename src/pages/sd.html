<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Statistics Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>
    <script id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
    <script src="../scripts/statscalc.js"></script>
    <script src="../scripts/pdfGenerator.js"></script>
    <script src="../scripts/ui-components.js"></script>
    <script src="../scripts/theme.js"></script>
    <script src="../scripts/history.js"></script>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
</head>

<body>

    <div class="container">
        
        <div class="head">
            <h1>Standard Deviation</h1>
            <i class="fa-regular fa-circle-question" id="info"></i>
            <div id="infoBox"></div>
        </div>
        <h2>Your Data's Average Distance from the Mean</h2>
        <div class="row">
            <label>Bin Size:</label>
            <input type="text" name="x" id="x" placeholder="Enter Interval size" required>
            <div class="button-wrapper">
                <button id="generateData">
                    <i class="fa-solid fa-angles-up"></i>
                </button>
                <div class="dropdown" id="dropdown-generate">
                    <a id="generate">Generate Data</a>
                </div>
            </div>
        </div>
        <div class="row">
            <label>Data:</label>
            <input type="text" name="y" id="y" placeholder="Enter Data" required>
            <div class="button-wrapper">
                <button id="importCsv">
                    <i class="fa-solid fa-file-arrow-up"></i>
                </button>
                <div class="dropdown" style="bottom:100%" id="dropdown-import">
                    <a id="import">Import CSV</a>
                </div>
            </div>
        </div>
        <div class="row" style="height: 0em;">
            <div class="button-wrapper" style="margin-left: auto;">
                <button id="exportPDF">
                    <i class="fa-solid fa-arrow-up-from-bracket"></i>
                </button>
                <div class="dropdown" style="bottom: 100%;" id="dropdown-export">
                    <a id="export">Export PDF</a>
                </div>
            </div>
        </div>
        <button id="calculate">Generate</button>
        
    </div>

    <p id="answer"></p>

    <div class="graph">
        <canvas id="myChart"></canvas>
    </div>

    <button id="steps">Show Steps</button>
    <p id="ansSteps"></p>

    <script>
        
        let x = document.getElementById("x");
        let y = document.getElementById("y");
        let submit = document.getElementById("calculate");
        let result = document.getElementById("answer");
        let steps = document.getElementById("steps");
        let ansSteps = document.getElementById("ansSteps");
        let myChart = null;
        let steps_html;

        const info = document.getElementById("info");
        const infoBox = document.getElementById('infoBox');
        let hoverTimer;
        const genDataBtn = document.getElementById("generateData");
        const importCsvBtn = document.getElementById("importCsv");
        const exportPdfBtn = document.getElementById("exportPDF");
        const dropdownGenerate = document.getElementById("dropdown-generate");
        const dropdownImport = document.getElementById("dropdown-import");
        const dropdownExport = document.getElementById("dropdown-export");
        const generate = document.getElementById("generate");
        let calc_values = null;

        const desc =  `
                   <h3>Variance and Standard Deviation</h3>

                <h4>
                    Measures of dispersion that describe how spread out the values in a dataset are.
                </h4>

                <ul>
                    <li>
                        <b>Variance</b> → Measures the average squared distance of data values from the mean. Larger variance indicates greater spread among the values.
                    </li>

                    <li>
                        <b>Standard Deviation</b> → Measures the average distance of data values from the mean. It is the square root of the variance and is expressed in the same units as the data.
                    </li>

                    <li>
                        <b>Small Values</b> → Indicate that most observations are clustered closely around the mean, showing low variability.
                    </li>

                    <li>
                        <b>Large Values</b> → Indicate that observations are spread further from the mean, showing high variability.
                    </li>
                </ul>
                `;

        function showInfo(){
            infoBox.innerHTML = desc;
            infoBox.classList.add("show");
        }
        function hideInfo(){
            infoBox.innerHTML = "";
            infoBox.classList.remove("show");

        }

        info.addEventListener("mouseenter",()=>{

            hoverTimer = setTimeout(()=>{
                showInfo();
            },1000);
        });

        info.addEventListener("mouseleave",()=>{

            clearTimeout(hoverTimer);
        });

        info.addEventListener("click",(e)=>{

            e.stopPropagation();

            if(infoBox.classList.contains("show")){
                hideInfo();
            }else{
                showInfo();
            }
        });

        infoBox.addEventListener("mouseenter", () => {
            clearTimeout(hoverTimer);
        });

        infoBox.addEventListener("mouseleave", () => {
            hideInfo();
        });

        document.addEventListener("click", () => {
            hideInfo();
        });

        genDataBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownGenerate.classList.toggle('show');
            dropdownImport.classList.remove('show');
            dropdownExport.classList.remove('show');
        });

        importCsvBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownImport.classList.toggle('show');
            dropdownGenerate.classList.remove('show');
            dropdownExport.classList.remove('show'); 
        });

        exportPdfBtn.addEventListener("click",(e) => {
            e.stopPropagation();
            dropdownExport.classList.toggle('show');
            dropdownImport.classList.remove('show');
            dropdownGenerate.classList.remove('show');
        });

        document.addEventListener('click', () => {
            dropdownGenerate.classList.remove('show');
            dropdownImport.classList.remove('show');
            dropdownExport.classList.remove('show');
        });

        generate.addEventListener("click",() => {
            const data = generateDataset(2,2,"sequential");
            x.value = 10;
            y.value = data[0][1];
        });

        document.addEventListener("keydown",(e) => {
            if (e.key === 'Enter' && e.target.tagName !== "TEXTAREA"){
                
                e.preventDefault();

                submit.classList.add('active-pressed');
                setTimeout(()=> {
                    submit.classList.remove('active-pressed');
                }, 150);

                setTimeout(()=>{
                    submit.click();
                }, 20);
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
    
            UIC.initImport("y");

            restoreHistoryInputs();

            submit.addEventListener("click",()=>{

                ansSteps.innerHTML = ' ';

            Chart.register(window['chartjs-plugin-annotation']);

            if(myChart){
                myChart.destroy();
            }

            steps.textContent = "Show Steps";

            let data_y;
            let bin_size;
            
            try{

                if(y.value.trim() === ""){
                    throw "Please enter some data.";
                }

                if(x.value.trim() === ""){
                    throw "Please enter bin size.";
                }

                data_y = y.value.trim().split(/[\s,]+/).map(Number);
                let x_value = x.value.trim().split(/[\s,]+/).map(Number);
                if(x_value.length > 1){
                    throw "Only one bin size allowed."
                }
                bin_size = x_value[0];
                if(Number.isNaN(Number(x.value)) || data_y.some(Number.isNaN)){
                    throw "Only numerical values are allowed.";
                }

            }catch(error){

                alert(error);
                return;

            }

            let values = variance(data_y);
            let var_y = values[0];
            let deviations = values[1];
            let sd = standard_dev(data_y);
            let mean_y = mean(data_y);
            let new_data = [];

            calc_values = { mean: mean_y, variance: var_y, sd: sd };

            let data_x = [];
            let final_value = Math.max(...data_y);
            for(let start = 0; start <= final_value; start += bin_size){

                let center = start + bin_size/2;

                data_x.push(center);
            }

            saveHistory(
                "Standard Deviation and Variance",
                "src/pages/sd.html",
                {
                    x : bin_size,
                    y : data_y
                },
                calc_values
                );
            

            for(i = 0; i < data_x.length; i++){
                let k;
                if(i == 0){
                    k = 0;
                }else{
                    k = data_x[i - 1];
                }
                s = 0;
                for(j = 0; j < data_y.length; j++){
            
                    let left = data_x[i] - bin_size/2;
                    let right = data_x[i] + bin_size/2;

                    if(parseFloat(data_y[j]) >= left &&
                       parseFloat(data_y[j]) < right){
                        s++;
                    }
                }
                new_data.push(s);
            }

            
            
            let sd1 = (mean_y + sd) > data_x[data_x.length - 1] ? data_x[data_x.length - 1] : (mean_y + sd);
            let sd2 = (mean_y - sd) < 0 ? 0 : (mean_y - sd);


            result.innerHTML = `
                <div style = "height: 6em;display: grid; text-align: center;grid-template-columns: auto auto auto; gap: 0 1em;
                 font-size: 2em; font-family: monospace;">
                    <span>Mean</span><span>:</span><span>${mean_y}</span>
                    <span>Variance</span><span>:</span><span>${var_y}</span>
                    <span>Standard Deviation</span><span>:</span><span>${sd}</span>
                    
                    
                </div>
            `;

            steps.style.display = "block";
            let norm = normal_distribution(data_y,mean_y,sd);
            let curve = norm.labels.map((x, i) => ({
                                        x: x,
                                        y: norm.curve[i]
                                    }));

            console.log(curve);

            myChart = new Chart('myChart', {

                type: 'bar',

                data: {

                    datasets: [

                        {
                            type: 'line',

                            label: 'Normal Distribution',

                            borderColor: 'rgb(8,60,160)',
                            borderWidth: 2,
                            pointRadius: 0,
                            tension: 0.4,

                            parsing: false,

                            data: curve.map(p => ({

                                x: p.x,

                                y: p.y * data_y.length * bin_size

                            }))
                        },
                        {
                            type: 'bar',

                            label: 'Data',

                            backgroundColor: 'rgb(10,100,255)',
                            borderColor: 'white',
                            borderWidth: 1,
                            barPercentage: 1.0,
                            categoryPercentage: 1.0,
                            barThickness: 'flex',
                            data: data_x.map((v,i)=>({

                                x: v,
                                y: new_data[i]

                            }))
                        }
                    ]
                },

                options: {

                    responsive: true,
                    devicePixelRatio: 4,

                    plugins: {

                        annotation: {

                            annotations: {

                                mean_line: {
                                    type: 'line',
                                    mode: 'vertical',
                                    scaleID: 'x',

                                    value: mean_y,

                                    borderColor: "rgb(231,84,128)",
                                    borderWidth: 2,
                                    borderDash: [10,5],

                                    label: {
                                        content: 'Mean',
                                        display: true
                                    }
                                },

                                sd_1: {
                                    type: 'line',
                                    mode: 'vertical',
                                    scaleID: 'x',

                                    value: sd1,

                                    borderColor: 'orange',
                                    borderWidth: 2,
                                    borderDash: [10,5],

                                    label: {
                                        content: '+1SD',
                                        display: true
                                    }
                                },

                                sd_2: {
                                    type: 'line',
                                    mode: 'vertical',
                                    scaleID: 'x',

                                    value: sd2,

                                    borderColor: 'orange',
                                    borderWidth: 2,
                                    borderDash: [10,5],

                                    label: {
                                        content: '-1SD',
                                        display: true
                                    }
                                }
                            }
                        }
                    },

                    scales: {

                        x: {

                            type: 'linear',

                            offset: false,

                            min: 0,
                            max: data_x[data_x.length - 1] + (bin_size / 2),

                            ticks: {

                                stepSize: bin_size
                            },

                            grid: {

                                offset: false
                            }
                        },

                        y: {

                            beginAtZero: true
                        }
                    }
                }
            });

            if(data_y.length > 10){
                let trimmed_y = data_y.slice(0,9);
                let trimmed_dev = deviations.slice(0,9);

                steps_html = `
                <div class="steps-container">

                    <h2>Variance and Standard Deviation</h2>

                    <p>
                        Standard deviation measures how far the data spreads from the mean.
                    </p>

                    

                    <h3>Step 1: Calculate the Mean</h3>

                    <p>
                        \\[
                        \\bar{x} = \\frac{\\sum x}{n}
                        \\]
                    </p>

                    <p>
                        \\[
                        \\bar{x}
                        =
                        \\frac{
                        ${data_y.map(Number).reduce((a,b)=>a+b,0)}
                        }{
                        ${data_y.length}
                        }
                        =
                        ${mean_y}
                        \\]
                    </p>

                    <h3>Step 2: Calculate the Deviations</h3>

                        <table class="deviation-table">

                            <tr>
                                <th>\\(x_i\\)</th>
                                <th>\\((x_i - \\bar{x})^2\\)</th>
                            </tr>

                            ${trimmed_y.map((v,i) => {

                                return `
                                    <tr>
                                        <td>${v}</td>
                                        <td>${trimmed_dev[i]}</td>
                                    </tr>
                                `;

                            }).join('')}

                                <tr>
                                    <td>...</td>
                                    <td>...</td>
                                </tr>
                                <tr>
                                    <td>${data_y[data_y.length - 1]}</td>
                                    <td>${deviations[data_y.length - 1]}</td>
                                </tr>

                        <tr class="sum-row">
                            <td>
                                <b>
                                \\[
                                \\sum (x_i - \\bar{x})^2
                                \\]
                                </b>
                            </td>

                            <td>
                                <b>${deviations.reduce((a,b)=>a+b,0)}</b>
                            </td>
                        </tr>

                    </table>

                <h3>Step 3: Calculate the Variance</h3>

                <p>
                    Formula:
                </p>

                <p>
                    \\[
                    \\sigma^2 =
                    \\frac{
                    \\sum (x_i - \\bar{x})^2
                    }{n}
                    \\]
                </p>

                <p>
                    Substituting:
                </p>

                <p>
                    \\[
                    \\sigma^2
                    =
                    \\frac{
                    ${Math.round(
                        data_y.reduce((s,v)=>{
                            let d = v - mean_y;
                            return s + d*d;
                        },0)*1000
                    )/1000}
                    }{
                    ${data_y.length}
                    }
                    \\]
                </p>

                <p>
                    \\[
                    \\sigma^2 = ${var_y}
                    \\]
                </p>

                <h3>Step 4: Calculate the Standard Deviation</h3>

                <p>
                    \\[
                    \\sigma = \\sqrt{\\sigma^2}
                    \\]
                </p>

                <p>
                    \\[
                    \\sigma = \\sqrt{${var_y}}
                    \\]
                </p>

                <p>
                    \\[
                    \\sigma = ${sd}
                    \\]
                </p>

                <h3>Final Answers</h3>

                <p style="font-size:1.2em;">
                    \\[
                    \\text{Mean} = ${mean_y}
                    \\]
                </p>

                <p style="font-size:1.2em;">
                    \\[
                    \\text{Variance} = ${var_y}
                    \\]
                </p>

                <p style="font-size:1.2em;">
                    \\[
                    \\text{Standard Deviation} = ${sd}
                    \\]
                </p>

            </div>
        `;    
        }else{ 

        steps_html = `
            <div class="steps-container">

                <h2>Variance and Standard Deviation</h2>

                <p>
                    Standard deviation measures how far the data spreads from the mean.
                </p>


                <h3>Step 1: Calculate the Mean</h3>

                <p>
                    \\[
                    \\bar{x} = \\frac{\\sum x}{n}
                    \\]
                </p>

                <p>
                    \\[
                    \\bar{x}
                    =
                    \\frac{
                    ${data_y.map(Number).reduce((a,b)=>a+b,0)}
                    }{
                    ${data_y.length}
                    }
                    =
                    ${mean_y}
                    \\]
                </p>

                <h3>Step 2: Calculate the Deviations</h3>

                    <table class="deviation-table">

                        <tr>
                            <th>\\(x_i\\)</th>
                            <th>\\((x_i - \\bar{x})^2\\)</th>
                        </tr>

                        ${data_y.map((v,i) => {

                            return `
                                <tr>
                                    <td>${v}</td>
                                    <td>${deviations[i]}</td>
                                </tr>
                            `;

                        }).join('')}

                        <tr class="sum-row">
                            <td>
                                <b>
                                \\[
                                \\sum (x_i - \\bar{x})^2
                                \\]
                                </b>
                            </td>

                            <td>
                                <b>${deviations.reduce((a,b)=>a+b,0)}</b>
                            </td>
                        </tr>

                    </table>

                <h3>Step 3: Calculate the Variance</h3>

                <p>
                    Formula:
                </p>

                <p>
                    \\[
                    \\sigma^2 =
                    \\frac{
                    \\sum (x_i - \\bar{x})^2
                    }{n}
                    \\]
                </p>

                <p>
                    Substituting:
                </p>

                <p>
                    \\[
                    \\sigma^2
                    =
                    \\frac{
                    ${Math.round(
                        data_y.reduce((s,v)=>{
                            let d = v - mean_y;
                            return s + d*d;
                        },0)*1000
                    )/1000}
                    }{
                    ${data_y.length}
                    }
                    \\]
                </p>

                <p>
                    \\[
                    \\sigma^2 = ${var_y}
                    \\]
                </p>

                <h3>Step 4: Calculate the Standard Deviation</h3>

                <p>
                    \\[
                    \\sigma = \\sqrt{\\sigma^2}
                    \\]
                </p>

                <p>
                    \\[
                    \\sigma = \\sqrt{${var_y}}
                    \\]
                </p>

                <p>
                    \\[
                    \\sigma = ${sd}
                    \\]
                </p>

                <h3>Final Answers</h3>

                <p style="font-size:1.2em;">
                    \\[
                    \\text{Mean} = ${mean_y}
                    \\]
                </p>

                <p style="font-size:1.2em;">
                    \\[
                    \\text{Variance} = ${var_y}
                    \\]
                </p>

                <p style="font-size:1.2em;">
                    \\[
                    \\text{Standard Deviation} = ${sd}
                    \\]
                </p>

            </div>
        `;
    }

    });
});

        steps.addEventListener("click",()=>{

            if(steps.textContent == "Show Steps"){

                ansSteps.innerHTML = steps_html;
                MathJax.typesetPromise();
                steps.textContent = "Hide Steps";
            }else if(steps.textContent == "Hide Steps"){

                ansSteps.innerHTML = ' ';
                steps.textContent = "Show Steps";
            }
        });

        document.getElementById("export").addEventListener("click", async () => {
            if (!calc_values) {
                alert("Please run the calculation first!");
                return;
            }

            const exportBtn = document.getElementById("export");
            const originalText = exportBtn.innerText;
            exportBtn.innerText = "Saving PDF...";
            exportBtn.style.pointerEvents = "none";

            const formattedY = formatDataForReport(y.value.trim());

            await generateModularPDF({
                title: "Standard Deviation and Variance Analysis",
                datasetHTML: `
                    <p style="margin: 0 0 10px 0;"><strong>Bin Size:</strong> ${x.value.trim()}</p>
                    <p style="margin: 0;"><strong>Dataset:</strong> ${formattedY}</p>
                `,
                resultsHTML: `
                    <div style="font-size: 18px; padding: 18px; background: #f0f7ff; text-align: center; border-radius: 8px; border: 1px solid #cce0ff; line-height: 2;">
                        <p style="margin: 0;"><strong>Mean (x̄):</strong> ${calc_values.mean}</p>
                        <p style="margin: 0;"><strong>Variance (σ²):</strong> ${calc_values.variance}</p>
                        <p style="margin: 0;"><strong>Standard Deviation (σ):</strong> ${calc_values.sd}</p>
                    </div>
                `,
                chartCanvasId: "myChart",
                stepsHTML: steps_html
            });

            exportBtn.innerText = originalText;
            exportBtn.style.pointerEvents = "auto";
        });

    </script>
</body>
</html>
