<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Statistics Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/jstat@latest/dist/jstat.min.js"></script>
    <script src="../scripts/statscalc.js"></script>
    <script src="../scripts/pdfGenerator.js"></script>
    <script src="../scripts/ui-components.js"></script>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        #ansSteps {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 0;
            padding: 0;
        }
        .steps-container {
            width: 100%;
            max-width: 950px;
            margin: 0 auto;
            padding: clamp(15px, 4vw, 60px);
            box-sizing: border-box;
            overflow-x: hidden;
        }
        /* 2. Auto-center scrolling tables in full screen while preventing overflow */
        .deviation-table {
            width: max-content;
            max-width: 100%;
            margin: 1.5em auto 2em auto !important;
            display: block;
            overflow-x: auto;
            white-space: nowrap;
            border-collapse: collapse;
            font-size: clamp(0.7rem, 1.2vw + 0.4rem, 1rem);
        }
        .deviation-table th, .deviation-table td {
            padding: 8px 14px; /* Reset to clean, compact vertical padding */
            text-align: center;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }
        .deviation-table mjx-container, .deviation-table mjx-assistive-mml {
            display: inline-block !important;
            margin: 0 !important;
            padding: 0 !important;
            width: auto !important;
        }
        mjx-container[display="true"] {
            width: max-content !important;
            max-width: 100% !important;
            margin: 1.2em auto !important;
            overflow-x: auto !important;
            overflow-y: hidden !important;
            display: block !important;
            text-align: center !important;
        }
        
    </style>
    
</head>
<body>

    <div class="container" style="height: 500px;">
        <div class="head">
            <h1>Chi-Square Goodness of Fit</h1>
            <i class="fa-regular fa-circle-question" id="info"></i>
            <div id="infoBox"></div>
        </div>
        <h2>Testing if observed frequencies fit expected distribution.</h2>

        <div class="row">
            <label>Obs:</label>
            <input type="text" name="obs" id="p" placeholder="Enter observed frequencies" required>
            <div class="button-wrapper" style="margin-left: auto; margin-bottom: 1em;">
                <button id="generateData">
                    <i class="fa-solid fa-angles-up"></i>
                </button>
                <div class="dropdown" id="dropdown-generate">
                    <a id="generate">Generate Data</a>
                </div>
            </div>
            
        </div>
        <div class="row">
            <label>Exp:</label>
            <input type="text" name="exp" id="n" placeholder="Enter expected frequencies" required>
            <div class="button-wrapper">
                <button id="importCsv">
                    <i class="fa-solid fa-file-arrow-up"></i>
                </button>
                <div class="dropdown" id="dropdown-import">
                    <a id="import">Import CSV</a>
                </div>
            </div>
        </div>

        <div class="row" style="height: 0em;">
            <div class="button-wrapper" style="margin-left: auto;">
                <button id="exportPDF">
                    <i class="fa-solid fa-arrow-up-from-bracket"></i>
                </button>
                <div class="dropdown" style="bottom: 100%;" id="dropdown-export">
                    <a id="export">Export PDF</a>
                </div>
            </div>
        </div>

        <button id="calculate">Generate</button>
    </div>

    <p id="answer"></p>

    <div class="graph">
        <canvas id="myChart"></canvas>
    </div>

    <button id="steps">Show Steps</button>
    <p id="ansSteps"></p>

    <script>
        let obsInput = document.getElementById("p");
        let expInput = document.getElementById("n");
        let submit = document.getElementById("calculate");
        let result = document.getElementById("answer");
        let steps = document.getElementById("steps");
        let ansSteps = document.getElementById("ansSteps");
        let my_chart = null;
        let steps_html;
        
        const info = document.getElementById("info");
        const infoBox = document.getElementById('infoBox');
        let hoverTimer;

        const genDataBtn = document.getElementById("generateData");
        const importCsvBtn = document.getElementById("importCsv");
        const exportPdfBtn = document.getElementById("exportPDF");
        const dropdownGenerate = document.getElementById("dropdown-generate");
        const dropdownImport = document.getElementById("dropdown-import");
        const dropdownExport = document.getElementById("dropdown-export");
        const generate = document.getElementById("generate");
        let calc_values = null;

        const desc = `
                <h3>Chi-Square Goodness of Fit Test</h3>
                <h4>
                    Determines whether observed categorical frequencies match an expected distribution.
                </h4>
                <ul>
                    <li><b>Observed</b> → Actual counts in each category.</li>
                    <li><b>Expected</b> → Expected counts (or proportions that will be scaled).</li>
                    <li>Requirements: Expected frequencies ≥ 5 in most cells.</li>
                </ul>
            `;

        function showInfo(){
            infoBox.innerHTML = desc;
            infoBox.classList.add("show");
        }
        function hideInfo(){
            infoBox.innerHTML = "";
            infoBox.classList.remove("show");
        }
        info.addEventListener("mouseenter",()=>{
            hoverTimer = setTimeout(()=>{
                showInfo();
            },1000);
        });
        info.addEventListener("mouseleave",()=>{
            clearTimeout(hoverTimer);
        });
        info.addEventListener("click",(e)=>{
            e.stopPropagation();
            if(infoBox.classList.contains("show")){
                hideInfo();
            }else{
                showInfo();
            }
        });
        infoBox.addEventListener("mouseenter", () => {
            clearTimeout(hoverTimer);
        });
        infoBox.addEventListener("mouseleave", () => {
            hideInfo();
        });
        document.addEventListener("click", () => {
            hideInfo();
        });

        genDataBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownGenerate.classList.toggle('show');
            dropdownImport.classList.remove('show');
            dropdownExport.classList.remove('show');
        });

        importCsvBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownImport.classList.toggle('show');
            dropdownGenerate.classList.remove('show');
            dropdownExport.classList.remove('show'); 
        });

        exportPdfBtn.addEventListener("click",(e) => {
            e.stopPropagation();
            dropdownExport.classList.toggle('show');
            dropdownImport.classList.remove('show');
            dropdownGenerate.classList.remove('show');
        });

        document.addEventListener('click', () => {
            dropdownGenerate.classList.remove('show');
            dropdownImport.classList.remove('show');
            dropdownExport.classList.remove('show');
        });

        generate.addEventListener("click",() => {
            const data = generateDataset(2,0,'random');
            let obs = data[0][0];
            let exp = data[0][1];
            if(obs.length > 30){
                obs = obs.slice(0,30);
                exp = exp.slice(0,30);
            }
            let sum1 = 0;
            let sum2 = 0;
            obs.forEach(n => sum1 += n);
            exp.forEach(n => sum2 += n);
            if(sum1 !== sum2){
                if(sum1 > sum2){
                    let diff = sum1 - sum2;
                    exp[exp.length - 1] = exp[exp.length - 1] + diff;
                }else{
                    let diff = sum2 - sum1;
                    obs[obs.length - 1] = obs[obs.length - 1] + diff;
                }
            }

            obsInput.value = obs;
            expInput.value = exp;

        });

        document.addEventListener("keydown",(e) => {
            if (e.key === 'Enter' && e.target.tagName !== "TEXTAREA"){
                e.preventDefault();
                submit.classList.add('active-pressed');
                setTimeout(()=> {
                    submit.classList.remove('active-pressed');
                }, 150);
                setTimeout(()=>{
                    submit.click();
                }, 20);
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            UIC.initImport("p", "n");
        });

        submit.addEventListener("click",()=>{
            ansSteps.innerHTML = ' ';
            steps.textContent = "Show Steps";
            if(my_chart) my_chart.destroy();

            let observed, expected, chi2, df, p_val;
            try{
                observed = obsInput.value.trim().split(/[\s,]+/).map(Number);
                expected = expInput.value.trim().split(/[\s,]+/).map(Number);
                if(observed.length !== expected.length || observed.some(isNaN) || expected.some(isNaN)){
                    throw "Observed and Expected must have same number of valid numbers.";
                }
                let totalObs = observed.reduce((a,b)=>a+b,0);
                if (
                    Math.abs(totalObs - expected.reduce((a,b)=>a+b,0))
                    > 1e-8
                ) {
                    throw "Observed and expected totals must be equal.";
                }
                if(expected.some(e=>e<=0)) throw "Expected frequencies must be > 0.";
                if(observed.some(o=>o<0)) throw "Observed frequencies must be >= 0";
                if(observed.length < 2) throw "At least 2 categories required.";
            }catch(error){
                alert(error);
                return;
            }

            let res = chi_square_gof(observed, expected);
            chi2 = res.chi2;
            df = res.df;
            p_val = res.pvalue;
            data = res.data;
            
            p_val = (p_val < 0.00001 ? p_val.toExponential(5) : p_val.toFixed(5));

            calc_values = {
                chi2: chi2,
                df: df,
                p_val: p_val,
                categories: observed.length
            };

            result.innerHTML = `
                <div style = "height: 7em;display: grid; text-align: center;grid-template-columns: auto auto auto; gap: 0 1em;
                 font-size: 2em; font-family: monospace;">
                    <span>Chi-Square Statistic</span><span>:</span><span>${chi2.toFixed(5)}</span>
                    <span>df</span><span>:</span><span>${df}</span>
                    <span>p-value</span><span>:</span><span>${p_val}</span>
                    <span>Categories</span><span>:</span><span>${observed.length}</span>
                </div>
            `;

            if(data.length > 10){
                let trimmed = data.slice(0,9); 
                steps_html = `
                        <div class="steps-container">

                        <h2>Chi-Square Goodness of Fit Test</h2>

                        <p><b>Null Hypothesis:</b> The observed frequencies follow the expected distribution.</p>

                        <p><b>Alternative Hypothesis:</b> The observed frequencies do not follow the expected distribution.</p>

                        <h3>Step 1: Formula</h3>

                        <p>
                        \\[
                        \\chi^2
                        =
                        \\sum
                        \\frac{(O-E)^2}{E}
                        \\]
                        </p>

                        <h3>Step 2: Observed and Expected Frequencies</h3>

                        <p>
                        Observed:
                        \\[
                        ${observed.join(", ")}
                        \\]
                        </p>

                        <p>
                        Expected:
                        \\[
                        ${expected.join(", ")}
                        \\]
                        </p>

                        <h3>Step 3: Contribution of Each Category</h3>

                        <table class="deviation-table">

                                                <tr>
                                                    <th>\\(Category\\)</th>
                                                    <th>\\(O\\)</th>
                                                    <th>\\(E\\)</th>
                                                    <th>\\((O - E)^2\\)</th>
                                                    <th>\\((O - E)^2/E\\)</th>
                                                </tr>
                                                ${trimmed.map((xVal,i)=>{

                                            return `
                                                <tr>
                                                    <td>${i + 1}</td>
                                                    <td>${trimmed[i].observed}</td>
                                                    <td>${trimmed[i].expected}</td>
                                                    <td>${trimmed[i].square}</td>
                                                    <td>${trimmed[i].value}</td>
                                                </tr>
                                            `;

                                        }).join('')}

                                            <tr>
                                                <td>...</td>
                                                <td>...</td>
                                                <td>...</td>
                                                <td>...</td>
                                                <td>...</td>
                                            </tr>

                                            <tr>
                                                <td>${data.length}</td>
                                                <td>${data[data.length - 1].observed}</td>
                                                <td>${data[data.length - 1].expected}</td>
                                                <td>${data[data.length - 1].square}</td>
                                                <td>${data[data.length - 1].value}</td>
                                            </tr>

                        </table>

                        <h3>Step 4: Sum the Contributions</h3>

                        <p>
                        \\[
                        \\chi^2
                        =
                        ${chi2.toFixed(5)}
                        \\]
                        </p>

                        <h3>Step 5: Degrees of Freedom</h3>

                        <p>
                        \\[
                        df
                        =
                        k-1
                        =
                        ${observed.length}-1
                        =
                        ${df}
                        \\]
                        </p>

                        <h3>Step 6: p-value</h3>

                        <p>
                        \\[
                        p
                        =
                        ${p_val}
                        \\]
                        </p>

                        <h3>Final Answer</h3>

                        <p style="font-size:1.4em;font-weight:bold;">
                        \\[
                        \\chi^2
                        =
                        ${chi2.toFixed(5)}
                        \\]
                        </p>

                        <p style="font-size:1.4em;font-weight:bold;">
                        \\[
                        p
                        =
                        ${p_val}
                        \\]
                        </p>

                        </div>
                        `;
            }else{
                steps_html = `
                <div class="steps-container">

                <h2>Chi-Square Goodness of Fit Test</h2>

                <p><b>Null Hypothesis:</b> The observed frequencies follow the expected distribution.</p>

                <p><b>Alternative Hypothesis:</b> The observed frequencies do not follow the expected distribution.</p>

                <h3>Step 1: Formula</h3>

                <p>
                \\[
                \\chi^2
                =
                \\sum
                \\frac{(O-E)^2}{E}
                \\]
                </p>

                <h3>Step 2: Observed and Expected Frequencies</h3>

                <p>
                Observed:
                \\[
                ${observed.join(", ")}
                \\]
                </p>

                <p>
                Expected:
                \\[
                ${expected.join(", ")}
                \\]
                </p>

                <h3>Step 3: Contribution of Each Category</h3>

                <table class="deviation-table">

                                        <tr>
                                            <th>\\(Category\\)</th>
                                            <th>\\(O\\)</th>
                                            <th>\\(E\\)</th>
                                            <th>\\((O - E)^2\\)</th>
                                            <th>\\(\\chi^2 = (O - E)^2/E\\)</th>
                                        </tr>
                                        ${data.map((xVal,i)=>{

                                    return `
                                        <tr>
                                            <td>${i + 1}</td>
                                            <td>${data[i].observed}</td>
                                            <td>${data[i].expected}</td>
                                            <td>${data[i].square}</td>
                                            <td>${data[i].value}</td>
                                        </tr>
                                    `;

                                }).join('')}

                </table>

                <h3>Step 4: Sum the Contributions</h3>

                <p>
                \\[
                \\sum \\chi^2
                =
                ${chi2.toFixed(5)}
                \\]
                </p>

                <h3>Step 5: Degrees of Freedom</h3>

                <p>
                \\[
                df
                =
                k-1
                =
                ${observed.length}-1
                =
                ${df}
                \\]
                </p>

                <h3>Step 6: p-value</h3>

                <p>
                \\[
                p
                =
                ${p_val}
                \\]
                </p>

                <h3>Final Answer</h3>

                <p style="font-size:1.4em;font-weight:bold;">
                \\[
                \\chi^2
                =
                ${chi2.toFixed(5)}
                \\]
                </p>

                <p style="font-size:1.4em;font-weight:bold;">
                \\[
                p
                =
                ${p_val}
                \\]
                </p>

                </div>
                `;

            }


            let labels = observed.map((_,i)=> `Cat ${i+1}`);
            my_chart = new Chart("myChart",{
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: "Observed", data: observed, backgroundColor: 'rgb(10,100,255)' },
                        { label: "Expected", data: expected, backgroundColor: 'rgb(255,100,10)' }
                    ]
                },
                options: {
                    responsive: true,
                    devicePixelRatio: 4
                }
            });

            steps.style.display = "block";
        });

        steps.addEventListener("click",()=>{
            if(steps.textContent == "Show Steps"){
                ansSteps.innerHTML = steps_html;
                MathJax.typesetPromise();
                steps.textContent = "Hide Steps";
            }else if(steps.textContent == "Hide Steps"){
                ansSteps.innerHTML = ' ';
                steps.textContent = "Show Steps";
            }
        });

        document.getElementById("export").addEventListener("click", async () => {
            if (!calc_values) {
                alert("Please run the calculation first!");
                return;
            }

            const exportBtn = document.getElementById("export");
            const originalText = exportBtn.innerText;
            exportBtn.innerText = "Saving PDF...";
            exportBtn.style.pointerEvents = "none";

            const formattedObs = formatDataForReport(obsInput.value.trim());
            const formattedExp = formatDataForReport(expInput.value.trim());

            await generateModularPDF({
                title: "Chi-Square Goodness of Fit Test",
                datasetHTML: `
                    <p style="margin: 0 0 10px 0;"><strong>Observed Frequencies:</strong> ${formattedObs}</p>
                    <p style="margin: 0;"><strong>Expected Frequencies:</strong> ${formattedExp}</p>
                `,
                resultsHTML: `
                    <div style="font-size: 18px; padding: 18px; background: #f0f7ff; text-align: center; border-radius: 8px; border: 1px solid #cce0ff; line-height: 2;">
                        <p style="margin: 0;"><strong>Chi-Square Statistic (χ²):</strong> ${calc_values.chi2.toFixed(5)}</p>
                        <p style="margin: 0;"><strong>Degrees of Freedom (df):</strong> ${calc_values.df}</p>
                        <p style="margin: 0;"><strong>Categories (k):</strong> ${calc_values.categories}</p>
                        <p style="margin: 0; font-weight: bold;"><strong>p-value:</strong> ${calc_values.p_val}</p>
                    </div>
                `,
                chartCanvasId: "myChart",
                stepsHTML: steps_html
            });

            exportBtn.innerText = originalText;
            exportBtn.style.pointerEvents = "auto";
        });
    </script>
</body>
</html>
