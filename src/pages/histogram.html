<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Statistics Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
    <script src="../scripts/statscalc.js"></script>
    <script src="../scripts/pdfGenerator.js"></script>
    <script src="../scripts/ui-components.js"></script>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="container">
        
        <div class="head">
            <h1>Mean,Median and Mode</h1>
            <i class="fa-regular fa-circle-question" id="info"></i>
            <div id="infoBox"></div>
        </div>
        <h2>Visualize how data is distributed</h2>
        <div class="row">
            <label>Bin Size:</label>
            <input type="text" name="x" id="x" placeholder="Enter Interval size" required>
            <div class="button-wrapper">
                <button id="generateData">
                    <i class="fa-solid fa-angles-up"></i>
                </button>
                <div class="dropdown" id="dropdown-generate">
                    <a id="generate">Generate Data</a>
                </div>
            </div>
        </div>
        <div class="row">
            <label>Data:</label>
            <input type="text" name="y" id="y" placeholder="Enter Data" required>
            <div class="button-wrapper">
                <button id="importCsv">
                    <i class="fa-solid fa-file-arrow-up"></i>
                </button>
                <div class="dropdown" style="bottom:100%" id="dropdown-import">
                    <a id="import">Import CSV</a>
                </div>
            </div>
        </div>
        <div class="row" style="height: 0em;">
            <div class="button-wrapper" style="margin-left: auto;">
                <button id="exportPDF">
                    <i class="fa-solid fa-arrow-up-from-bracket"></i>
                </button>
                <div class="dropdown" style="bottom: 100%;" id="dropdown-export">
                    <a id="export">Export PDF</a>
                </div>
            </div>
        </div>
        <button id="calculate">Generate</button>
    </div>

    <p id="answer"></p>


    <div class="graph">
        <canvas id="myChart"></canvas>
    </div>

    <button id="steps">Show Steps</button>
    <p id="ansSteps"></p>

    <script>
        
        let x = document.getElementById("x");
        let y = document.getElementById("y");
        let submit = document.getElementById("calculate");
        let result = document.getElementById("answer");
        let steps = document.getElementById("steps");
        let ansSteps = document.getElementById("ansSteps");
        let my_chart = null;
        let steps_html;

        const info = document.getElementById("info");
        const infoBox = document.getElementById('infoBox');
        let hoverTimer;
        const genDataBtn = document.getElementById("generateData");
        const importCsvBtn = document.getElementById("importCsv");
        const exportPdfBtn = document.getElementById("exportPDF");
        const dropdownGenerate = document.getElementById("dropdown-generate");
        const dropdownImport = document.getElementById("dropdown-import");
        const dropdownExport = document.getElementById("dropdown-export");
        const generate = document.getElementById("generate");
        let calc_values = null;

        const desc = ` <h3>Mean, Median and Mode</h3>

            <h4>
                Measures of central tendency that describe the typical or central value of a dataset.
            </h4>

            <ul>
                <li>
                    <b>Mean</b> → The arithmetic average of all values. It is found by adding all values together and dividing by the number of values.
                </li>

                <li>
                    <b>Median</b> → The middle value when the data is arranged in ascending order. If there is an even number of values, the median is the average of the two middle values.
                </li>

                <li>
                    <b>Mode</b> → The value that occurs most frequently in the dataset. A dataset may have one mode, multiple modes, or no mode if all values occur equally often.
                </li>
            </ul>`;

        function showInfo(){
            infoBox.innerHTML = desc;
            infoBox.classList.add("show");
        }
        function hideInfo(){
            infoBox.innerHTML = "";
            infoBox.classList.remove("show");

        }

        info.addEventListener("mouseenter",()=>{

            hoverTimer = setTimeout(()=>{
                showInfo();
            },1000);
        });

        info.addEventListener("mouseleave",()=>{

            clearTimeout(hoverTimer);
        });

        info.addEventListener("click",(e)=>{

            e.stopPropagation();

            if(infoBox.classList.contains("show")){
                hideInfo();
            }else{
                showInfo();
            }
        });

        infoBox.addEventListener("mouseenter", () => {
            clearTimeout(hoverTimer);
        });

        infoBox.addEventListener("mouseleave", () => {
            hideInfo();
        });

        document.addEventListener("click", () => {
            hideInfo();
        });

        genDataBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownGenerate.classList.toggle('show');
            dropdownImport.classList.remove('show');
            dropdownExport.classList.remove('show');
        });

        importCsvBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownImport.classList.toggle('show');
            dropdownGenerate.classList.remove('show');
            dropdownExport.classList.remove('show'); 
        });

        exportPdfBtn.addEventListener("click",(e) => {
            e.stopPropagation();
            dropdownExport.classList.toggle('show');
            dropdownImport.classList.remove('show');
            dropdownGenerate.classList.remove('show');
        });

        document.addEventListener('click', () => {
            dropdownGenerate.classList.remove('show');
            dropdownImport.classList.remove('show');
            dropdownExport.classList.remove('show');
        });

        generate.addEventListener("click",() => {
            const data = generateDataset(2,2,"sequential");
            x.value = 10;
            y.value = data[0][1];
        });

        document.addEventListener("keydown",(e) => {
            if (e.key === 'Enter' && e.target.tagName !== "TEXTAREA"){
                
                e.preventDefault();

                submit.classList.add('active-pressed');
                setTimeout(()=> {
                    submit.classList.remove('active-pressed');
                });

                setTimeout(()=>{
                    submit.click();
                });
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
    
            UIC.initImport("y");

            submit.addEventListener("click",()=>{

                ansSteps.innerHTML = ' ';

                if(my_chart){
                    my_chart.destroy();
                }

                steps.textContent = "Show Steps";

                let data_y;
                let bin_size;
                try{

                    if(y.value.trim() === ""){
                        throw "Please enter some data.";
                    }

                    if(x.value.trim() === ""){
                        throw "Please enter bin size.";
                    }

                    data_y = y.value.trim().split(/[\s,]+/).map(Number);
                    let x_value = x.value.trim().split(/[\s,]+/).map(Number);
                    if(x_value.length > 1){
                        throw "Only one bin size allowed."
                    }
                    bin_size = x_value[0];

                    if(Number.isNaN(Number(x.value)) || data_y.some(Number.isNaN)){
                        throw "Only numerical values are allowed.";
                    }

                }catch(error){

                    alert(error);
                    return;

                }

                let values = central_tendency(data_y);
                calc_values = values;
                
                let final_value = Math.max(...data_y);
                let new_data = [];
                let data_x = [];
                for(let start = 0; start <= final_value; start += bin_size){

                    let center = start + bin_size/2;

                    data_x.push(center);
                }
                

                for(i = 0; i < data_x.length; i++){
                    let k;
                    if(i == 0){
                        k = 0;
                    }else{
                        k = data_x[i - 1];
                    }
                    s = 0;
                    for(j = 0; j < data_y.length; j++){
                
                        let left = data_x[i] - bin_size/2;
                        let right = data_x[i] + bin_size/2;

                        if(parseFloat(data_y[j]) >= left &&
                           parseFloat(data_y[j]) < right){
                            s++;
                        }
                    }
                    new_data.push(s);
                }
                

                result.innerHTML = `
                    <div style = "height: 6em;display: grid; text-align: center;grid-template-columns: auto auto auto; gap: 0 1em;
                     font-size: 2em; font-family: monospace;">
                        <span>Mean</span><span>:</span><span>${values[0]}</span>
                        <span>Median</span><span>:</span><span>${values[1]}</span>
                        <span>Mode</span><span>:</span><span>${values[2]}</span>
                        
                        
                    </div>
                `;

                steps.style.display = "block";

                my_chart = new Chart('myChart', {

                    type: 'bar',

                    data: {

                        datasets: [

                            {
                                label: 'Data',

                                backgroundColor: 'rgb(10,100,255)',
                                borderColor: 'white',
                                borderWidth: 1,

                                barPercentage: 1.0,
                                categoryPercentage: 1.0,
                                barThickness: 'flex',

                                data: data_x.map((v,i)=>({

                                    x: v,
                                    y: new_data[i]

                                }))
                            }
                        ]
                    },

                    options: {

                        responsive: true,
                        devicePixelRatio: 4,
                        scales: {

                            x: {
                                type: 'linear',
                                offset: false,
                                min: 0,
                                max: data_x[data_x.length - 1] + (bin_size / 2),

                                ticks: {

                                    stepSize: bin_size
                                },

                                grid: {

                                    offset: false
                                }
                            },

                            y: {

                                beginAtZero: true
                            }
                        }
                    }
                });

                let sorted = [...data_y].sort((a,b)=>a-b);
                let cut_sorted = sorted.slice(0,9).join(', ');
                cut_sorted = cut_sorted + ' ... ' + String(sorted[sorted.length - 1]);
                console.log(cut_sorted);
                steps_html = `
                    <div class="steps-container">

                        <h2>Measures of Central Tendency</h2>

                        <p>
                            The three primary measures of central tendency are:
                        </p>

                        <ul style="font-size:1.1em; line-height:2;">
                            <li><b>Mean</b> — Average value</li>
                            <li><b>Median</b> — Middle value</li>
                            <li><b>Mode</b> — Most frequently occurring value</li>
                        </ul>

                        <h3>Step 1: Sort the Data</h3>

                        <p>
                            \\[
                            ${cut_sorted}
                            \\]
                            
                        </p>

                        <h3>Step 2: Calculate the Mean</h3>

                        <p>
                            Formula:
                        </p>

                        <p>
                            \\[
                            \\text{Mean} = \\frac{\\sum x}{n}
                            \\]
                        </p>

                        <p>
                            Total Sum:
                        </p>

                        <p>
                            \\[
                            \\sum x = ${data_y.reduce((a,b)=>a+b,0)}
                            \\]
                        </p>

                        <p>
                            Number of Data Points:
                        </p>

                        <p>
                            \\[
                            n = ${data_y.length}
                            \\]
                        </p>

                        <p>
                            Substituting:
                        </p>

                        <p>
                            \\[
                            \\text{Mean}
                            =
                            \\frac{${data_y.reduce((a,b)=>a+b,0)}}{${data_y.length}}
                            =
                            ${values[0]}
                            \\]
                        </p>

                        <h3>Step 3: Calculate the Median</h3>

                        <p>
                            The median is the middle value of the sorted data.
                        </p>

                        <p>
                            Sorted Data:
                        </p>

                        <p>
                            \\[
                            ${cut_sorted}
                            \\]
                        </p>

                        <p>
                            Median:
                        </p>

                        <p>
                            \\[
                            \\text{Median} = ${values[1]}
                            \\]
                        </p>

                        <h3>Step 4: Calculate the Mode</h3>

                        <p>
                            The mode is the value that occurs most frequently.
                        </p>

                        <p>
                            \\[
                            \\text{Mode} = ${values[2]}
                            \\]
                        </p>

                        <h3>Final Answers</h3>

                        <p style="font-size:1.2em;">
                            \\[
                            \\text{Mean} = ${values[0]}
                            \\]
                        </p>

                        <p style="font-size:1.2em;">
                            \\[
                            \\text{Median} = ${values[1]}
                            \\]
                        </p>

                        <p style="font-size:1.2em;">
                            \\[
                            \\text{Mode} = ${values[2]}
                            \\]
                        </p>

                    </div>
                `;
            });
        });

        steps.addEventListener("click",()=>{

            if(steps.textContent == "Show Steps"){
                ansSteps.innerHTML = steps_html;
                MathJax.typesetPromise();
                steps.textContent = "Hide Steps";
            }else if(steps.textContent == "Hide Steps"){
                ansSteps.innerHTML = ' ';
                steps.textContent = "Show Steps";
            }
        });

        document.getElementById("export").addEventListener("click", async () => {
            if (!calc_values) {
                alert("Please run the calculation first!");
                return;
            }

            const exportBtn = document.getElementById("export");
            const originalText = exportBtn.innerText;
            exportBtn.innerText = "Saving PDF...";
            exportBtn.style.pointerEvents = "none";

            const formattedY = formatDataForReport(y.value.trim());

            await generateModularPDF({
                title: "Measures of Central Tendency Analysis",
                datasetHTML: `
                    <p style="margin: 0 0 10px 0;"><strong>Bin Size:</strong> ${x.value.trim()}</p>
                    <p style="margin: 0;"><strong>Dataset:</strong> ${formattedY}</p>
                `,
                resultsHTML: `
                    <div style="font-size: 18px; padding: 18px; background: #f0f7ff; text-align: center; border-radius: 8px; border: 1px solid #cce0ff; line-height: 2;">
                        <p style="margin: 0;"><strong>Mean:</strong> ${calc_values[0]}</p>
                        <p style="margin: 0;"><strong>Median:</strong> ${calc_values[1]}</p>
                        <p style="margin: 0;"><strong>Mode:</strong> ${calc_values[2]}</p>
                    </div>
                `,
                chartCanvasId: "myChart",
                stepsHTML: steps_html
            });

            exportBtn.innerText = originalText;
            exportBtn.style.pointerEvents = "auto";
        });

    </script>
</body>
</html>
