<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Statistics Calculator</title>
	<script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  	<script id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  	</script>
	<script src="../scripts/statscalc.js"></script>
	<link rel="stylesheet" type="text/css" href="styles.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>


<body>

	<div class="container">
		
		<div class="head">
			<h1>Collatz Conjecture</h1>
			<i class="fa-regular fa-circle-question" id="info"></i>
			<div id="infoBox"></div>
		</div>
		<h2>Is every number contained inside the loop?</h2>
		<div class="row">
			<label>Value</label>
			<input type="text" name="x" id="x" placeholder="Enter a value" required>
		</div>
		<button id="calculate">Calculate</button>
	</div>

	<div class="graph">
		<canvas id="myChart"></canvas>
	</div>

	<button id="steps">Show Steps</button>
	<p id="ansSteps"></p>

	<script>
		let x = document.getElementById("x");
		let submit = document.getElementById("calculate");
		let steps = document.getElementById("steps");
		let ansSteps = document.getElementById("ansSteps");
		let my_Chart = null;
		let steps_html;
		const info = document.getElementById("info");
		const infoBox = document.getElementById('infoBox');
		let hoverTimer;
		const desc =  `
			        <h3>Collatz Conjecture</h3>
					<h4>An unsolved mathematical problem where simple rules produce surprisingly complex sequences.</h4>
					<ul>
					    <li>Start with any positive integer.</li>
					    <li>If the number is even, divide it by 2. If it is odd, multiply it by 3 and add 1.</li>
					    <li>Repeat the process. Every number tested so far eventually reaches the repeating loop <strong>4 → 2 → 1</strong>, but no proof has ever been found that this is true for every positive integer.</li>
					</ul>
			    `;

		function showInfo(){
			infoBox.innerHTML = desc;
			infoBox.classList.add("show");
		}
		function hideInfo(){
			infoBox.innerHTML = "";
			infoBox.classList.remove("show");

		}

		info.addEventListener("mouseenter",()=>{

			hoverTimer = setTimeout(()=>{
				showInfo();
			},1000);
		});

		info.addEventListener("mouseleave",()=>{

			clearTimeout(hoverTimer);
		});

		info.addEventListener("click",(e)=>{

			e.stopPropagation();

			if(infoBox.classList.contains("show")){
				hideInfo();
			}else{
				showInfo();
			}
		});

		infoBox.addEventListener("mouseenter", () => {
		    clearTimeout(hoverTimer);
		});

		infoBox.addEventListener("mouseleave", () => {
		    hideInfo();
		});

		document.addEventListener("click", () => {
		    hideInfo();
		});

		submit.addEventListener("click",()=>{

			ansSteps.innerHTML = ' ';

			if (my_Chart){
				my_Chart.destroy();
			}

			steps.textContent = "Show Steps";

		
		try{

			if(x.value.trim() === ""){
			    throw "Please enter some data.";
			}

		    x_value = x.value.trim().split(/[\s,]+/).map(Number);

		    if(x_value.some(Number.isNaN)){
		        throw "Only numerical values are allowed.";
		    }

		    if(x_value.length > 1){
		        throw "Only one value allowed.";
		    }

		}catch(error){

		    alert(error);
		    return;

		}

		let number = x_value[0];
		let dataset = collatz(number);
		let labels = dataset[0];
		let results = dataset[1];
		

		my_Chart = new Chart("myChart",{
			type: "line",
			data: {

				labels: labels,
				datasets: [{
					label: "Steps",
					pointRadius: 4,
					pointBackgroundColor: "blue",
					data: results,
					lineTension: 0,
					borderColor: "rgb(10,100,255)"
				}]
			}
		});

		steps.style.display = 'block';
		steps_html = `
			<div class="steps-container">

				<h2>Collatz Conjecture</h2>

				<p>
					Start with any positive integer. At each step, apply one of two rules depending on whether the current number is even or odd.
				</p>

				<h3>Step 1: Collatz Rules</h3>

				<p>
					\\[
					f(n)=
					\\begin{cases}
					\\dfrac{n}{2}, & \\text{if } n \\text{ is even}\\\\[6pt]
					3n+1, & \\text{if } n \\text{ is odd}
					\\end{cases}
					\\]
				</p>

				<h3>Step 2: Start the Sequence</h3>

				<p>
					Initial value:
				</p>

				<p>
					\\[
					n_0 = ${number}
					\\]
				</p>

				<h3>Step 3: Apply the Rule Repeatedly</h3>

				<p>
					First iteration:
				</p>

				<p>
					\\[
					n_1 = ${results[1]}
					\\]
				</p>

				<p>
					Second iteration:
				</p>

				<p>
					\\[
					n_2 = ${results[2]}
					\\]
				</p>

				<p>
					Continue applying the same rule to each new value until the sequence reaches the repeating cycle:
				</p>

				<p>
					\\[
					4 \\rightarrow 2 \\rightarrow 1 \\rightarrow 4 \\rightarrow \\cdots
					\\]
				</p>

				<h3>Step 4: Visualize the Sequence</h3>

				<p>
					The graph plots the value obtained at each iteration, showing how the sequence rises and falls before eventually entering the repeating loop.
				</p>

			</div>
			`;

	});

		steps.addEventListener("click",()=>{

			if(steps.textContent == "Show Steps"){ 

				ansSteps.innerHTML = steps_html;
				MathJax.typesetPromise();
				steps.textContent = "Hide Steps";
			}else if(steps.textContent == "Hide Steps"){
				ansSteps.innerHTML = ' ';
				steps.textContent = "Show Steps";
			}
		});
	</script>
</body>
</html>
