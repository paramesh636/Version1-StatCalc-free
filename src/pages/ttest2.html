<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistics Calculator</title>
<script src="https://cdn.jsdelivr.net/npm/mathjs@11.8.0/lib/browser/math.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
   <script id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
   </script>
   <script src="https://cdn.jsdelivr.net/npm/jstat@latest/dist/jstat.min.js"></script>
<script src="statscalc.js"></script>
<link rel="stylesheet" type="text/css" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="container" style="height: 750px;">
<div class="head">
<h1>Two-Sample t-Test</h1>
<i class="fa-regular fa-circle-question" id="info"></i>
<div id="infoBox"></div>
</div>
<h2>Comparing means of two independent samples.</h2>
<div class="row">
<label>X1:</label>
<input type="text" name="m1" id="p" placeholder="Enter Sample 1 Mean" required>
</div>
<div class="row">
<label>n1:</label>
<input type="text" name="n1" id="n" placeholder="Enter Sample 1 Size" required>
</div>
<div class="row">
<label>X2:</label>
<input type="text" name="m2" id="m2" placeholder="Enter Sample 2 Mean" required>
</div>
<div class="row">
<label>n2:</label>
<input type="text" name="n2" id="n2" placeholder="Enter Sample 2 Size" required>
</div>
<div class="row">
<label>Type:</label>
<select name="Choose Type" id="select">
<option value="less">Hₐ: μ₁ < μ₂ (Left-tailed)</option>
<option value="more">Hₐ: μ₁ > μ₂ (Right-tailed)</option>
<option value="between">Hₐ: μ₁ ≠ μ₂ (Two-tailed)</option>
</select>
</div>
<div class="row">
<label>SD1:</label>
<input type="text" name="s1" id="s1" placeholder="Sample 1 Std Dev" required>
</div>
<div class="row">
<label>SD2:</label>
<input type="text" name="s2" id="s2" placeholder="Sample 2 Std Dev" required>
</div>
<button id="calculate">Generate</button>
</div>
<p id="answer"></p>
<div class="graph">
<canvas id="myChart"></canvas>
</div>
<button id="steps">Show Steps</button>
<p id="ansSteps"></p>
<script>
let mean1Input = document.getElementById("p");
let n1Input = document.getElementById("n");
let mean2Input = document.getElementById("m2");
let n2Input = document.getElementById("n2");
let s1Input = document.getElementById("s1");
let s2Input = document.getElementById("s2");
let submit = document.getElementById("calculate");
let result = document.getElementById("answer");
let steps = document.getElementById("steps");
let ansSteps = document.getElementById("ansSteps");
let my_chart = null;
let options = document.getElementById("select");
let steps_html;
const info = document.getElementById("info");
const infoBox = document.getElementById('infoBox');
let hoverTimer;
const desc = `
        <h3>Two-Sample t-Test (Independent Samples)</h3>
<h4>
    Tests whether the means of two independent samples are significantly different.
</h4>
<ul>
    <li><b>Sample 1:</b> Mean (x̄₁), Size (n₁), Std Dev (s₁)</li>
    <li><b>Sample 2:</b> Mean (x̄₂), Size (n₂), Std Dev (s₂)</li>
    <li>Assumptions: Independent samples, approximately normal or large n.</li>
    <li>Uses Welch's approximation (unequal variances).</li>
</ul>
    `;
function showInfo(){
infoBox.innerHTML = desc;
infoBox.classList.add("show");
}
function hideInfo(){
infoBox.innerHTML = "";
infoBox.classList.remove("show");
}
info.addEventListener("mouseenter",()=>{
hoverTimer = setTimeout(()=>{
showInfo();
},1000);
});
info.addEventListener("mouseleave",()=>{
clearTimeout(hoverTimer);
});
info.addEventListener("click",(e)=>{
e.stopPropagation();
if(infoBox.classList.contains("show")){
hideInfo();
}else{
showInfo();
}
});
infoBox.addEventListener("mouseenter", () => {
    clearTimeout(hoverTimer);
});
infoBox.addEventListener("mouseleave", () => {
    hideInfo();
});
document.addEventListener("click", () => {
    hideInfo();
});

submit.addEventListener("click",()=>{
ansSteps.innerHTML = ' ';
steps.textContent = "Show Steps";
if(my_chart){
my_chart.destroy();
}
let xbar1, xbar2, n1, n2, s1, s2, t_stat, p_val, df;
try{
if(mean1Input.value.trim() === "" || n1Input.value.trim() === "" || 
   mean2Input.value.trim() === "" || n2Input.value.trim() === "" ||
   s1Input.value.trim() === "" || s2Input.value.trim() === ""){
    throw "Please enter all required data.";
}
    xbar1 = parseFloat(mean1Input.value.trim());
    n1 = parseInt(n1Input.value.trim());
    xbar2 = parseFloat(mean2Input.value.trim());
    n2 = parseInt(n2Input.value.trim());
    s1 = parseFloat(s1Input.value.trim());
    s2 = parseFloat(s2Input.value.trim());

    if(isNaN(xbar1) || isNaN(xbar2) || isNaN(n1) || isNaN(n2) || 
       isNaN(s1) || isNaN(s2) || n1 <= 1 || n2 <= 1 || s1 <= 0 || s2 <= 0){
        throw "Invalid inputs. Sample sizes > 1 and SDs > 0.";
    }
}catch(error){
    alert(error);
    return;
}

let res = two_sample_t_test(xbar1, xbar2, s1, s2, n1, n2); 
t_stat = res.t;
df = res.df;
p_val = calculate_t_pvalue(t_stat, df, options.value); 
const se =Math.sqrt(s1*s1/n1+s2*s2/n2);

p_val = (p_val < 0.00001 ? p_val.toExponential(5) : p_val.toFixed(5));

result.innerHTML = `
<div style = "height: 9em;display: grid; text-align: center;grid-template-columns: auto auto auto; gap: 0 1em;
 font-size: 2em; font-family: monospace;">
<span>t-statistic</span><span>:</span><span>${t_stat.toFixed(5)}</span>
<span>df (Welch)</span><span>:</span><span>${df.toFixed(2)}</span>
<span>p-value</span><span>:</span><span>${p_val}</span>
    <span>Mean Diff.</span><span>:</span><span>${(xbar1 - xbar2).toFixed(5)}</span>
    <span>Standard Error</span><span>:</span><span>${se.toFixed(5)}</span>
</div>
`;

steps_html = `
<div class="steps-container">

<h2>Two-Sample t-Test (Welch's Test)</h2>

<p><b>Null Hypothesis:</b> \\(\\mu_1 = \\mu_2\\)</p>
<p><b>Alternative Hypothesis:</b> ${
    options.value === "less"
        ? "\\(\\mu_1 < \\mu_2\\)"
        : options.value === "more"
        ? "\\(\\mu_1 > \\mu_2\\)"
        : "\\(\\mu_1 \\neq \\mu_2\\)"
}</p>

<h3>Step 1: Formula</h3>

<p>
\\[
t=
\\frac{\\bar{x}_1-\\bar{x}_2}
{
\\sqrt{
\\frac{s_1^2}{n_1}
+
\\frac{s_2^2}{n_2}
}
}
\\]
</p>

<h3>Step 2: Sample Values</h3>

<p>
\\[
\\bar{x}_1=${xbar1},
\\quad
n_1=${n1},
\\quad
s_1=${s1}
\\]
</p>

<p>
\\[
\\bar{x}_2=${xbar2},
\\quad
n_2=${n2},
\\quad
s_2=${s2}
\\]
</p>

<h3>Step 3: Mean Difference</h3>

<p>
\\[
\\bar{x}_1-\\bar{x}_2
=
${xbar1}
-
${xbar2}
=
${(xbar1-xbar2).toFixed(5)}
\\]
</p>

<h3>Step 4: Standard Error</h3>

<p>
\\[
SE=
\\sqrt{
\\frac{${s1}^2}{${n1}}
+
\\frac{${s2}^2}{${n2}}
}
=
${se.toFixed(5)}
\\]
</p>

<h3>Step 5: Calculate the t-statistic</h3>

<p>
\\[
t=
\\frac{
${(xbar1-xbar2).toFixed(5)}
}
{
${se.toFixed(5)}
}
=
${t_stat.toFixed(5)}
\\]
</p>

<h3>Step 6: Degrees of Freedom</h3>

<p>
Welch-Satterthwaite approximation:
</p>

<p>
\\[
df
\\approx
${df.toFixed(2)}
\\]
</p>

<h3>Step 7: p-value</h3>

<p>
\\[
p
=
${p_val}
\\]
</p>

<p>
(${options.value === "between" ? "Two-tailed test" : "One-tailed test"})
</p>

<h3>Final Answer</h3>

<p style="font-size:1.4em;font-weight:bold;">

\\[
t=${t_stat.toFixed(5)}
\\]

</p>

<p>

\\[
p=${p_val}
\\]

</p>

</div>
`;

let limit = Math.max(4, Math.ceil(Math.abs(t_stat) + 2));
let labels = [];
let curve = [];
for (let x = -limit; x <= limit; x += 0.05) {
    labels.push(x);
    curve.push(jStat.studentt.pdf(x, df));
}
let maxY = Math.max(...curve);

let shadedRegion = labels.map((x, i) => {
    let shade = false;
    if (options.value === "less") {
        shade = (x <= t_stat);
    } else if (options.value === "more") {
        shade = (x >= t_stat);
    } else {
        shade = (Math.abs(x) >= Math.abs(t_stat));
    }
    return { x: x, y: shade ? curve[i] : null };
});

my_chart = new Chart("myChart", {
    type: "line",
    data: {
        datasets: [
            {
                label: "Null (diff=0)",
                data: [{ x: 0, y: 0 }, { x: 0, y: maxY }],
                borderWidth: 3,
                pointRadius: 0,
                borderColor: "#E75480",
                backgroundColor: "#E75480"
            },
            {
                label: "t Distribution",
                data: labels.map((x, i) => ({ x: x, y: curve[i] })),
                borderWidth: 3,
                pointRadius: 0,
                tension: 0.4,
                borderColor: "rgb(10,100,255)",
                backgroundColor: "rgba(10,100,255,0.1)",
                fill: true
            },
            {
                label: "Observed t",
                data: [{ x: t_stat, y: 0 }, { x: t_stat, y: maxY }],
                borderWidth: 3,
                pointRadius: 0,
                borderColor: "rgb(255, 99, 132)",
                backgroundColor: "rgb(255, 99, 132)"
            },
            {
                label: "P-value Region",
                data: shadedRegion,
                borderWidth: 0,
                pointRadius: 0,
                backgroundColor: "rgb(10,100,255)",
                fill: true,
                tension: 0.4
            }
        ]
    },
    options: {
        responsive: true,
        plugins: {
            title: {
                display: true,
                text: `t = ${t_stat.toFixed(4)} | p = ${p_val} | df ≈ ${df.toFixed(1)}`
            }
        },
        scales: {
            x: { type: "linear", title: { display: true, text: "t Statistic" } },
            y: { display: false }
        }
    }
});

steps.style.display = "block";
});

steps.addEventListener("click",()=>{
if(steps.textContent == "Show Steps"){
ansSteps.innerHTML = steps_html;
MathJax.typesetPromise();
steps.textContent = "Hide Steps";
}else if(steps.textContent == "Hide Steps"){
ansSteps.innerHTML = ' ';
steps.textContent = "Show Steps";
}
});
</script>
</body>
</html>
